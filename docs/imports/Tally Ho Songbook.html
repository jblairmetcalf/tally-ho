<title>Tally Ho Songbook</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--fg);font-family:var(--f-body);overscroll-behavior-y:none;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(116px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.app.in-game{padding-bottom:56px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;flex:none}
.fields{display:flex;flex-direction:column;gap:10px}
.field-row{display:flex;align-items:center;gap:10px}
.field-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-in{width:104px;height:54px;text-align:center;outline:none;font-variant-numeric:tabular-nums;flex:none}
.sign{width:40px;height:50px;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 4px;margin-inline:-4px}
.pills.scroll::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:7px}
.group{display:flex;flex-direction:column;gap:9px}
.row2{display:flex;gap:10px;align-items:center}.row2>*{flex:1;min-width:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:8px 4px 14px;margin-inline:-4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.chip{position:relative;display:grid;place-items:center;flex:none;width:var(--s);height:var(--s)}
.chip b{position:relative;line-height:1;font-size:calc(var(--s)*.46)}
.chip .crown{position:absolute;left:50%;top:calc(var(--s)*-.5);width:calc(var(--s)*.64);margin-left:calc(var(--s)*-.32);animation:crownDrop .7s var(--spring) both;overflow:visible}
.chip .crown-p{fill:var(--crown);stroke:var(--chip-ink);stroke-width:1.6;stroke-linejoin:round}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:var(--backdrop);animation:fadeIn .25s ease both}
.sheet{position:relative;width:100%;max-width:560px;margin:0 auto -48px;max-height:calc(92% + 48px);display:flex;flex-direction:column;padding-bottom:48px;animation:sheetIn .5s var(--spring) both}
.closing .backdrop{animation:fadeOut .26s ease forwards}
.closing .sheet{animation:sheetOut .28s cubic-bezier(.5,0,.75,0) forwards}
.grab{padding:10px 0 6px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab span{width:44px;height:5px;border-radius:3px}
.sheet-body{overflow-y:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:4px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet-title{display:flex;align-items:center;gap:12px}
.sheet-title h3{margin:0;flex:1;text-wrap:balance}
.log-head,.log-row{display:grid;grid-template-columns:40px repeat(var(--n),minmax(0,1fr)) 26px;align-items:center;gap:4px;padding:9px 8px}
.log-head span,.log-row span{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-row{width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-inner{max-width:540px;margin:0 auto 10px;height:64px;display:grid;grid-template-columns:1fr 96px 1fr;align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px}
.fab{justify-self:center;width:76px;height:76px;margin-top:-30px;display:grid;place-items:center;position:relative}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:70;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);width:max-content;animation:toastIn .45s var(--spring) both}
.toast.low{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.ribbon-wrap{position:fixed;left:0;right:0;top:calc(26% + env(safe-area-inset-top,0px));z-index:65;pointer-events:none;overflow:hidden;min-height:140px;display:grid;place-items:center}
.victory{position:fixed;inset:0;z-index:80;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:max(28px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:fadeIn .3s ease both}
.victory>*{flex:none}
.victory .v-inner{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}
.fox{overflow:visible}
.fox .f-fur{fill:var(--fox-fur)}.fox .f-cream{fill:var(--fox-cream)}.fox .f-ink{fill:var(--fox-ink)}.fox .f-line{stroke:var(--fox-ink)}.fox .f-shade{fill:var(--fox-shade)}.fox .f-crown{fill:var(--fox-crown);stroke:var(--fox-ink)}
.fox .eyes,.fox .eye-r{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.fox.wink .eye-r{animation:wink .7s ease .9s}
.fox .crown-g{transform-box:fill-box;transform-origin:50% 100%;animation:crownDrop .8s var(--spring) .3s both}
.fox .ear-l,.fox .ear-r{transform-box:fill-box;transform-origin:50% 100%}
.fox.twitch .ear-r{animation:earTwitch .5s ease}
.fox.twitch .ear-l{animation:earTwitch .5s ease .08s}
.rise{animation:rise .5s var(--spring) both;animation-delay:calc(var(--i,0)*60ms)}
.shake{animation:shake .35s}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:vtCircle .7s cubic-bezier(.65,0,.2,1)}
@keyframes vtCircle{from{clip-path:circle(0 at var(--vt-x) var(--vt-y))}to{clip-path:circle(150vmax at var(--vt-x) var(--vt-y))}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{from{transform:translateY(var(--from,0px))}to{transform:translateY(105%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px) scale(.85)}}
@keyframes crownDrop{0%{opacity:0;transform:translateY(-24px) rotate(-30deg)}55%{opacity:1;transform:translateY(3px) rotate(10deg)}75%{transform:translateY(-2px) rotate(-4deg)}100%{transform:none}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wink{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(.08)}}
@keyframes earTwitch{0%,100%{transform:none}40%{transform:rotate(-10deg)}70%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* Layout: one-column riso zine. A masthead cover, then the charts, a mixtape of game songs and liner notes. Two inks overprint everywhere. */
:root{
  --f-display:'Bowlby One','Arial Black',Impact,system-ui,sans-serif;
  --f-body:'Familjen Grotesk',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.5,.5,1);
  --bg:#EFF0EC;--paper:#FAFAF6;--fg:#1E2C78;--soft:#535E99;--faint:#9097BE;--rule:#CDD0E2;
  --pink:#FF48B0;--blue:#0078BF;--yellow:#FFD500;--orange:#FF6C2F;--teal:#00A095;--purple:#765BA7;
  --blend:multiply;--grain:.32;--shade:rgba(30,44,120,.3);
  --main:#FF48B0;--main-ink:#FFFFFF;--danger:#E8314B;
  --focus:#0078BF;--crown:#FFD500;--chip-ink:#FFFFFF;
  --t-amber:#F2B200;--t-fox:#FF6C2F;--t-jade:#00A095;--t-lav:#765BA7;--t-pink:#FF48B0;--t-sky:#0078BF;
  --p0:#FF48B0;--p1:#0078BF;--p2:#FF6C2F;--p3:#00A095;--p4:#765BA7;--p5:#D9A300;--p6:#00A95C;--p7:#E8314B;
  --fox-fur:#FF6C2F;--fox-cream:#FAFAF6;--fox-ink:#1E2C78;--fox-shade:#FF48B0;--fox-crown:#FFD500;
  --backdrop:rgba(30,44,120,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F15;--paper:#17171F;--fg:#ECEEFF;--soft:#A2A7D4;--faint:#5E6390;--rule:#2B2D42;
  --pink:#FF5CBC;--blue:#3AA6FF;--yellow:#FFE14D;--orange:#FF7E45;--teal:#22C7B8;--purple:#A58BFF;
  --blend:screen;--grain:.16;--shade:rgba(0,0,0,.45);
  --main:#FF5CBC;--main-ink:#0F0F15;--danger:#FF5468;
  --focus:#3AA6FF;--crown:#FFE14D;--chip-ink:#0F0F15;
  --t-amber:#FFD43B;--t-fox:#FF7E45;--t-jade:#22C7B8;--t-lav:#A58BFF;--t-pink:#FF5CBC;--t-sky:#3AA6FF;
  --p0:#FF5CBC;--p1:#3AA6FF;--p2:#FF7E45;--p3:#22C7B8;--p4:#A58BFF;--p5:#FFE14D;--p6:#3FD27F;--p7:#FF5468;
  --fox-cream:#F2F0E8;--fox-ink:#0F0F15;--backdrop:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F15;--paper:#17171F;--fg:#ECEEFF;--soft:#A2A7D4;--faint:#5E6390;--rule:#2B2D42;
  --pink:#FF5CBC;--blue:#3AA6FF;--yellow:#FFE14D;--orange:#FF7E45;--teal:#22C7B8;--purple:#A58BFF;
  --blend:screen;--grain:.16;--shade:rgba(0,0,0,.45);
  --main:#FF5CBC;--main-ink:#0F0F15;--danger:#FF5468;
  --focus:#3AA6FF;--crown:#FFE14D;--chip-ink:#0F0F15;
  --t-amber:#FFD43B;--t-fox:#FF7E45;--t-jade:#22C7B8;--t-lav:#A58BFF;--t-pink:#FF5CBC;--t-sky:#3AA6FF;
  --p0:#FF5CBC;--p1:#3AA6FF;--p2:#FF7E45;--p3:#22C7B8;--p4:#A58BFF;--p5:#FFE14D;--p6:#3FD27F;--p7:#FF5468;
  --fox-cream:#F2F0E8;--fox-ink:#0F0F15;--backdrop:rgba(0,0,0,.6);color-scheme:dark}
body{background-color:var(--bg);color:var(--fg);font-weight:500;font-size:15.5px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:95;opacity:var(--grain);mix-blend-mode:var(--blend);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .45  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
::view-transition-new(root){animation:vtDiag .7s cubic-bezier(.65,0,.2,1)}
@keyframes vtDiag{from{clip-path:polygon(0 0,0 0,0 0)}to{clip-path:polygon(0 0,250% 0,0 250%)}}

.ht{background-image:radial-gradient(circle,var(--c) 36%,transparent 39%);background-size:7px 7px}
.mis{position:relative;display:inline-block;color:var(--blue)}
.mis::before{content:attr(data-t);position:absolute;left:0;top:0;width:100%;color:var(--pink);mix-blend-mode:var(--blend);transform:translate(var(--mx,3px),var(--my,2px));pointer-events:none}
.mis.jiggle::before{animation:misJ .7s var(--spring)}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.hint{font-size:14px;color:var(--soft);margin:0}
.sec{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:var(--fg)}
.h-title{font-family:var(--f-display);font-weight:400;font-size:44px;margin:4px 0 0;line-height:.95;text-transform:uppercase;color:var(--blue);text-shadow:3px 2px 0 var(--pink)}
.hist-head{display:flex;align-items:flex-end;gap:8px}
.card{background:var(--paper);border:2px solid var(--fg);border-radius:14px;padding:16px;position:relative}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.link{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);display:inline-flex;align-items:center;gap:2px;background:linear-gradient(transparent 60%,var(--yellow) 60%)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:16px;transition:transform .15s var(--spring),box-shadow .15s;user-select:none}
.btn:active{transform:translate(3px,3px)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}
.btn-main{background:var(--main);color:var(--main-ink);border:2px solid var(--fg);box-shadow:4px 4px 0 var(--blue)}
.btn-main:active{box-shadow:1px 1px 0 var(--blue)}
.btn-quiet{background:var(--paper);color:var(--fg);border:2px solid var(--fg)}
.btn-danger{background:transparent;color:var(--danger);border:2px dashed var(--danger)}
.btn-danger.armed{background:var(--danger);color:var(--paper);border-style:solid;animation:shake .35s}
.icon-btn{border-radius:50%;background:var(--paper);border:2px solid var(--fg);color:var(--fg);transition:transform .2s var(--spring)}
.icon-btn:active{transform:scale(.86) rotate(14deg)}
.icon-btn.on{background:var(--yellow);color:#1E2C78}
.close-btn{border-width:2px}

.pill{padding:8px 14px;border-radius:12px;border:2px solid var(--fg);background:var(--paper);font-weight:700;font-size:14px;color:var(--fg);transition:transform .15s var(--spring)}
.pill:active{transform:scale(.92)}
.pill.on{background:var(--yellow);color:#1E2C78;box-shadow:3px 3px 0 var(--pink)}
.input{width:100%;background:var(--paper);border:2px solid var(--fg);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;outline:none;color:var(--fg)}
.input:focus{box-shadow:3px 3px 0 var(--pink)}
.input::placeholder,.score-in::placeholder{color:var(--faint)}
.score-in{background:var(--paper);border:2px solid var(--fg);border-radius:12px;font-family:var(--f-display);font-size:26px;color:var(--blue);transition:box-shadow .15s,transform .25s var(--spring)}
.score-in:focus{box-shadow:4px 4px 0 var(--pink);transform:translate(-2px,-2px)}
.sign{border-radius:12px;border:2px solid var(--rule);color:var(--soft);font-weight:700;font-size:18px}
.seg{border:2px solid var(--fg);border-radius:12px;padding:4px;background:var(--paper)}
.seg button{border-radius:8px;padding:9px 4px;font-weight:700;font-size:13.5px;color:var(--soft);text-align:center}
.seg button.on{background:var(--blue);color:var(--paper)}
.field-name{font-weight:700;font-size:17px}
.player-line{display:flex;align-items:center;gap:12px;border:2px solid var(--rule);border-radius:12px;padding:7px 7px 7px 10px;animation:rise .35s var(--spring) both}
.player-line .n{flex:1;font-weight:700;font-size:16px}
.x-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--danger)}
.err{color:var(--danger);font-weight:700;font-size:14px}

.chip{border-radius:50%;background:var(--c);box-shadow:2px 2px 0 var(--fg)}
.chip b{font-family:var(--f-display);font-weight:400;color:var(--chip-ink);font-size:calc(var(--s)*.44)}
.chip .crown-p{stroke:var(--fg)}

.sheet{background:var(--paper);border:2px solid var(--fg);border-bottom:0;border-radius:20px 20px 0 0}
.grab span{background:var(--fg);opacity:.35}
.sheet-title h3{font-family:var(--f-display);font-weight:400;font-size:28px;text-transform:uppercase;line-height:1;color:var(--blue);text-shadow:2.5px 2px 0 var(--pink)}
.log{display:flex;flex-direction:column;font-family:var(--f-mono)}
.log-head{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);border-bottom:2px solid var(--fg)}
.log-row{border-bottom:1px solid var(--rule);transition:background .15s}
.log-row:active{background:var(--bg)}
.log-row .rn{color:var(--faint);text-align:left;font-size:12px}
.log-row .sc{font-size:15px;font-weight:500}
.log-row .sc.top{color:var(--paper);background:var(--c);border-radius:6px;padding:1px 0}
.log-row .sc.blank{color:var(--faint)}
.log-row .ed{color:var(--faint);display:grid;place-items:center}
.log-row.fresh .sc{animation:inkIn .6s var(--spring) both}
.podium{width:100%;display:flex;flex-direction:column;gap:0;border-top:2px solid var(--fg)}
.pod{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--rule);animation:rise .45s var(--spring) both}
.pod .place{font-family:var(--f-display);font-size:20px;color:var(--faint);width:40px}
.pod.first .place{color:var(--pink)}
.pod .n{flex:1;font-weight:700;font-size:16px}
.pod .t{font-family:var(--f-display);font-size:22px;color:var(--blue)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 16px}
.empty .fox{width:110px;height:110px}

.nav-inner{background:var(--paper);border:2px solid var(--fg);border-radius:18px;box-shadow:4px 4px 0 var(--pink)}
.nav-btn{color:var(--faint);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
.nav-btn.on{color:var(--fg)}
.nav-btn.on .ic{color:var(--pink)}
.fab{border-radius:50%;background:var(--yellow);border:2px solid var(--fg);box-shadow:4px 4px 0 var(--blue);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.9) rotate(-10deg)}
.fab .fox{width:58px;height:58px;margin-top:8px}
.fab .plus{position:absolute;right:-4px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--pink);color:var(--paper);border:2px solid var(--fg);display:grid;place-items:center}
.toast{background:var(--paper);color:var(--fg);border:2px solid var(--fg);font-weight:700;font-size:14.5px;padding:10px 16px;border-radius:12px;box-shadow:4px 4px 0 var(--pink)}
.toast .ic{color:var(--pink)}
.ribbon{font-family:var(--f-display);font-size:44px;text-transform:uppercase;color:var(--blue);border:5px solid var(--blue);border-radius:14px;padding:6px 22px 8px;background:transparent;position:relative;white-space:nowrap;animation:stampBanner 1.45s var(--spring) forwards;text-shadow:3px 2px 0 var(--pink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--blue)}
.ribbon.amber{color:var(--orange);border-color:var(--orange);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--orange);text-shadow:3px 2px 0 var(--blue)}
.ribbon.coral{color:var(--pink);border-color:var(--pink);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--pink);text-shadow:3px 2px 0 var(--blue)}

/* masthead */
.mast{border-bottom:3px solid var(--fg);padding-bottom:12px}

<script>
window.TH=(function(){
'use strict';
const {useState,useEffect,useRef,useMemo,useLayoutEffect}=React;
const html=htm.bind(React.createElement);

/* ============ data ============ */
const KEY='tallyho.v3';
const DEFAULT_PLAYERS=['Kate','Blair','Alder'];
const PRESETS=[
  {name:'Flip 7',goal:'score',target:200},
  {name:'Sushi Go',goal:'rounds',target:3},
  {name:'Sushi Go Party',goal:'rounds',target:3},
  {name:'Skull King',goal:'rounds',target:10},
  {name:'Uno',goal:'score',target:500},
  {name:'Cribbage',goal:'score',target:121},
  {name:'Spades',goal:'score',target:500},
  {name:'Rummy',goal:'score',target:500},
];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const load=()=>{try{const r=store.get(KEY);if(!r)return null;const d=JSON.parse(r);return d&&Array.isArray(d.games)?d:null}catch(e){return null}};
const save=d=>store.set(KEY,JSON.stringify(d));
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const parseScore=s=>{s=String(s??'').trim();if(s===''||s==='-')return null;const n=parseInt(s,10);return isNaN(n)?null:n};
const fmtDate=(iso,o={month:'short',day:'numeric'})=>new Date(iso).toLocaleDateString('en-US',o);
const vibrate=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const after=(ms,fn)=>setTimeout(fn,ms);
const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const midi=m=>440*Math.pow(2,(m-69)/12);
const joinNames=a=>a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+' & '+a[a.length-1];

function totalsAt(g,k){const t={};g.players.forEach(p=>t[p]=0);g.rounds.slice(0,k).forEach(r=>g.players.forEach(p=>{t[p]+=r.scores[p]||0}));return t}
const totalsOf=g=>totalsAt(g,g.rounds.length);
function topOf(t,players){const m=Math.max(...players.map(p=>t[p]));return players.filter(p=>t[p]===m)}
const leadersOf=g=>topOf(totalsOf(g),g.players);
const leaderOf=g=>{if(!g.rounds.length)return null;const l=leadersOf(g);return l.length===1?l[0]:null};
function evaluate(g){
  const t=totalsOf(g);
  const reached=g.goal==='score'?g.players.some(p=>t[p]>=g.target):g.goal==='rounds'?g.rounds.length>=g.target:false;
  if(!reached)return{done:false};
  const l=leadersOf(g);
  return l.length===1?{done:true,winner:l[0]}:{done:false,tie:true};
}
const goalLabel=g=>g.goal==='score'?`Race to ${g.target}`:g.goal==='rounds'?`${g.target} rounds`:'Open-ended';
const ranked=g=>{const t=totalsOf(g);return [...g.players].sort((a,b)=>t[b]-t[a])};
function leadTimeline(g){const out=[];for(let k=1;k<=g.rounds.length;k++){const l=topOf(totalsAt(g,k),g.players);out.push(l.length===1?l[0]:null)}return out}
function roundTop(r,players){const vals=players.map(p=>r.scores[p]??0);const m=Math.max(...vals);if(m<=0)return[];return players.filter(p=>(r.scores[p]??0)===m)}
function leadChanges(g){let c=0,prev=null;leadTimeline(g).forEach(l=>{if(l&&prev&&l!==prev)c++;if(l)prev=l});return c}
function songOf(g){return g.rounds.map(r=>{const ps=roundTop(r,g.players);return{ps,v:ps.length?(r.scores[ps[0]]??0):0}})}

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function makeSamples(){
  const r=rng(11),P=DEFAULT_PLAYERS,now=new Date();
  const plan=[['Flip 7','score',200],['Sushi Go','rounds',3],['Flip 7','score',200],['Skull King','rounds',10],['Flip 7','score',200],['Sushi Go','rounds',3],['Flip 7','score',200],['Flip 7','score',200],['Sushi Go','rounds',3],['Flip 7','score',200]];
  return plan.map(([name,goal,target],i)=>{
    const d=new Date(now);d.setDate(d.getDate()-(plan.length-i)*3-1);d.setHours(18+Math.floor(r()*5),Math.floor(r()*60),0,0);
    const g={id:'s'+i,sample:true,name,goal,target,players:P.slice(),rounds:[],startedAt:d.toISOString(),completedAt:null,winner:null};
    const skill={};P.forEach(p=>skill[p]=.75+r()*.5);
    let res={done:false},guard=0;
    while(!res.done&&guard++<40){
      const sc={};
      P.forEach(p=>{let v;
        if(name==='Flip 7')v=r()<.16?0:Math.round((8+r()*48)*skill[p]);
        else if(name==='Sushi Go')v=Math.round((14+r()*30)*skill[p]);
        else v=Math.round((r()*10-3)*skill[p])*10;
        sc[p]=v});
      g.rounds.push({scores:sc});res=evaluate(g);
    }
    g.winner=res.winner||ranked(g)[0];
    g.completedAt=new Date(d.getTime()+45*60e3).toISOString();
    return g;
  }).reverse();
}
function fresh(){return{games:makeSamples(),active:null,colors:{Kate:0,Blair:1,Alder:2},lastPlayers:DEFAULT_PLAYERS.slice(),muted:false,hasSamples:true}}

/* ============ awards ============ */
const AWARDS=[
  {id:'crown',name:'First Crown',desc:'Win your first game',tone:'amber',icon:'crown'},
  {id:'hat',name:'Hat Trick',desc:'Win three games in a row',tone:'fox',icon:'flame'},
  {id:'comeback',name:'Comeback Kid',desc:'Win after trailing by 30 or more',tone:'jade',icon:'rocket'},
  {id:'wire',name:'Wire to Wire',desc:'Lead after every round (3+)',tone:'lav',icon:'route'},
  {id:'photo',name:'Photo Finish',desc:'Win by 5 points or fewer',tone:'pink',icon:'camera'},
  {id:'steam',name:'Steamroller',desc:'Finish with 1.5× the runner-up',tone:'fox',icon:'weight'},
  {id:'haymaker',name:'Haymaker',desc:'Score 60+ in a single round',tone:'sky',icon:'bolt'},
  {id:'bust',name:'Big Fat Zero',desc:'Score nothing while others score',tone:'pink',icon:'zero'},
  {id:'marathon',name:'Marathon',desc:'Play a game of 10+ rounds',tone:'jade',icon:'clock'},
  {id:'polymath',name:'Polymath',desc:'Win three different games',tone:'lav',icon:'cards'},
  {id:'ten',name:'Double Digits',desc:'Win 10 games',tone:'amber',icon:'trophy'},
  {id:'owl',name:'Night Owl',desc:'Finish a game after 10 pm',tone:'sky',icon:'moon'},
];
const awardById=Object.fromEntries(AWARDS.map(a=>[a.id,a]));
function computeAwards(games){
  const asc=games.filter(g=>g.winner).sort((a,b)=>a.completedAt.localeCompare(b.completedAt));
  const counts={},byGame={},wins={},types={};let sp=null,sn=0;
  const give=(p,id,g)=>{counts[p]=counts[p]||{};const isNew=!counts[p][id];counts[p][id]=(counts[p][id]||0)+1;(byGame[g.id]=byGame[g.id]||[]).push({p,id,isNew})};
  asc.forEach(g=>{
    const w=g.winner,t=totalsOf(g),order=ranked(g),second=order[1];
    wins[w]=(wins[w]||0)+1;
    if(wins[w]===1)give(w,'crown',g);
    if(wins[w]===10)give(w,'ten',g);
    sn=w===sp?sn+1:1;sp=w;if(sn%3===0)give(w,'hat',g);
    (types[w]=types[w]||new Set()).add(g.name);if(types[w].size===3&&!(counts[w]||{}).polymath)give(w,'polymath',g);
    let deficit=0;for(let k=1;k<=g.rounds.length;k++){const tk=totalsAt(g,k);deficit=Math.max(deficit,Math.max(...g.players.map(p=>tk[p]))-tk[w])}
    if(deficit>=30)give(w,'comeback',g);
    const tl=leadTimeline(g);if(tl.length>=3&&tl.every(l=>l===w))give(w,'wire',g);
    if(second&&t[w]-t[second]<=5)give(w,'photo',g);
    if(second&&t[second]>0&&t[w]>=1.5*t[second]&&g.rounds.length>=2)give(w,'steam',g);
    g.players.forEach(p=>{
      if(g.rounds.some(r=>(r.scores[p]??0)>=60))give(p,'haymaker',g);
      if(g.rounds.some(r=>(r.scores[p]??0)===0&&g.players.some(q=>(r.scores[q]??0)>0)))give(p,'bust',g);

/* ============ app ============ */
function initialTheme(){
  const t=store.get(KEY+'.theme');if(t==='light'||t==='dark')return t;
  const h=document.documentElement.getAttribute('data-theme');if(h==='light'||h==='dark')return h;
  return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}

function App({V}){
  const[data,setData]=useState(()=>load()||fresh());
  const[theme,setTheme]=useState(initialTheme);
  const[screen,setScreen]=useState(()=>data.active?'game':'home');
  const[sheet,setSheet]=useState(null);const[closing,setClosing]=useState(false);
  const[toast,setToast]=useState(null);const[banner,setBanner]=useState(null);
  const[flash,setFlash]=useState(null);const[moment,setMoment]=useState(null);
  const[victory,setVictory]=useState(null);const[finished,setFinished]=useState(null);
  const tRef=useRef(),bRef=useRef();
  const S=V.sfx;
  useEffect(()=>{save(data)},[data]);
  useEffect(()=>{SND.setMuted(!!data.muted)},[data.muted]);
  useLayoutEffect(()=>{document.documentElement.setAttribute('data-theme',theme);store.set(KEY+'.theme',theme)},[theme]);
  useEffect(()=>{const u=()=>SND.unlock();addEventListener('pointerdown',u,{once:true});return()=>removeEventListener('pointerdown',u)},[]);

  const colorIdx=n=>((data.colors&&data.colors[n])??hash(n))%8;
  const colorOf=n=>`var(--p${colorIdx(n)})`;
  const stats=useMemo(()=>computeStats(data.games),[data.games]);
  const awards=useMemo(()=>computeAwards(data.games),[data.games]);

  const showToast=(msg,icon)=>{clearTimeout(tRef.current);setToast({msg,icon,k:Date.now()});tRef.current=after(2700,()=>setToast(null))};
  const showBanner=(text,tone='')=>{clearTimeout(bRef.current);setBanner({text,tone,k:Date.now()});bRef.current=after(V.bannerMs||1450,()=>setBanner(null))};
  const openSheet=s=>{S.open();setClosing(false);setSheet(s)};
  const closeSheet=silent=>{if(!sheet)return;if(!silent)S.close();setClosing(true);after(290,()=>{setSheet(null);setClosing(false)})};
  const go=s=>{setScreen(s);window.scrollTo({top:0})};
  const toggleMute=()=>{const m=!data.muted;SND.setMuted(m);if(!m)S.pick();setData(d=>({...d,muted:m}))};
  const toggleTheme=e=>{
    const next=theme==='dark'?'light':'dark';const root=document.documentElement;
    const r=e&&e.currentTarget&&e.currentTarget.getBoundingClientRect?e.currentTarget.getBoundingClientRect():null;
    root.style.setProperty('--vt-x',(r?r.left+r.width/2:innerWidth-40)+'px');root.style.setProperty('--vt-y',(r?r.top+r.height/2:40)+'px');
    S.theme(next);
    const apply=()=>{root.setAttribute('data-theme',next);ReactDOM.flushSync(()=>setTheme(next))};
    if(document.startViewTransition&&!reduceMotion())document.startViewTransition(apply);else apply();
  };
  const assignColor=n=>setData(d=>{if(d.colors[n]!=null)return d;const used=new Set(Object.values(d.colors));let i=0;while(used.has(i)&&i<8)i++;if(i>=8)i=hash(n)%8;return{...d,colors:{...d.colors,[n]:i}}});

  function startGame(cfg){
    const g={id:'g'+Date.now(),name:cfg.name,goal:cfg.goal,target:cfg.target,players:cfg.players.slice(),rounds:[],startedAt:new Date().toISOString(),completedAt:null,winner:null};
    const hadSamples=data.hasSamples;
    setData(d=>{const colors={...d.colors};const used=new Set(Object.values(colors));cfg.players.forEach(p=>{if(colors[p]==null){let i=0;while(used.has(i)&&i<8)i++;colors[p]=i<8?i:hash(p)%8;used.add(colors[p])}});
      return{...d,active:g,colors,lastPlayers:cfg.players.slice(),games:d.hasSamples?d.games.filter(x=>!x.sample):d.games,hasSamples:false}});
    closeSheet(true);setVictory(null);setFinished(null);setFlash(null);setMoment(null);go('game');
    S.start(g);after(250,()=>showBanner(V.copy.start(cfg.name),'amber'));
    if(hadSamples)after(1600,()=>showToast(V.copy.samplesCleared));
  }
  function finish(g,winner){
    g.winner=winner;g.completedAt=new Date().toISOString();
    const games=[g,...data.games.filter(x=>x.id!==g.id)];
    const rc=recapOf(g,computeAwards(games));
    setData(d=>({...d,active:null,games}));setFinished(g);
    after(500,()=>{setVictory({g,recap:rc,k:Date.now()});S.win(g);vibrate([30,60,30])});
  }
  function detectMoment(g,before,tb){
    const lead=leaderOf(g),ta=totalsOf(g),k=g.rounds.length;
    if(lead&&lead!==before&&k>1)return{type:'lead',p:lead,names:lead};
    if(k>=3){const tops=g.rounds.slice(-3).map(r=>roundTop(r,g.players));const p=tops[0].length===1?tops[0][0]:null;
      const prior=k>=4?roundTop(g.rounds[k-4],g.players):[];
      if(p&&tops.every(t=>t.length===1&&t[0]===p)&&!(prior.length===1&&prior[0]===p))return{type:'hot',p,names:p}}
    if(g.goal==='score'){const m=g.players.filter(p=>ta[p]>=g.target*.85&&tb[p]<g.target*.85&&ta[p]<g.target);if(m.length)return{type:'match',ps:m,names:joinNames(m)}}
    const last=g.rounds[k-1];const busts=g.players.filter(p=>(last.scores[p]??0)===0);
    if(busts.length&&busts.length<g.players.length)return{type:'bust',ps:busts,names:joinNames(busts)};
    return null;
  }
  function submitRound(vals,btn){
    const g=clone(data.active);const before=leaderOf(g);const tb=totalsOf(g);
    const sc={};g.players.forEach((p,i)=>sc[p]=parseScore(vals[i]));
    g.rounds.push({scores:sc,at:new Date().toISOString()});
    S.submit(g,colorIdx);vibrate(12);FX.fromEl(btn,V.submitBurst||20,{power:9,spread:1.6});
    setFlash({k:Date.now(),gid:g.id,scores:sc});
    const res=evaluate(g);
    if(res.done){finish(g,res.winner);return}
    setData(d=>({...d,active:g}));
    const n=g.rounds.length+1;
    if(res.tie){after(250,()=>{S.tie(g);showBanner(V.copy.tie,'coral')});showToast(V.copy.tieToast);return}
    if(g.goal==='rounds'&&n===g.target)after(250,()=>showBanner(V.copy.final,'amber'));
    else after(250,()=>showBanner(V.copy.round(n),''));
    const m=detectMoment(g,before,tb);
    if(m)after(800,()=>{S[m.type]&&S[m.type](g,m,colorIdx);setMoment({...m,k:Date.now()});showToast(V.copy[m.type](m.names),m.type)});
  }
  function saveRound(idx,vals){
    const g=clone(data.active);g.players.forEach((p,i)=>g.rounds[idx].scores[p]=parseScore(vals[i]));
    closeSheet(true);S.submit(g,colorIdx);setFlash({k:Date.now(),gid:g.id,scores:g.rounds[idx].scores,edit:true});
    const res=evaluate(g);if(res.done){finish(g,res.winner);return}
    setData(d=>({...d,active:g}));showToast(`Round ${idx+1} saved`);
  }
  function deleteRound(idx){const g=clone(data.active);g.rounds.splice(idx,1);closeSheet(true);S.del();setData(d=>({...d,active:g}));showToast(`Round ${idx+1} deleted`)}
  function endGame(){const g=clone(data.active);const l=leadersOf(g);closeSheet(true);if(l.length===1&&g.rounds.length)finish(g,l[0])}
  function discardGame(){closeSheet(true);S.del();setData(d=>({...d,active:null}));go('home');showToast('Game discarded')}
  function deleteGame(id){closeSheet(true);S.del();setData(d=>({...d,games:d.games.filter(g=>g.id!==id)}));showToast('Game deleted')}
  function clearSamples(){S.del();setData(d=>({...d,games:d.games.filter(g=>!g.sample),hasSamples:false}));showToast('Samples cleared')}
  const rematch=g=>startGame({name:g.name,goal:g.goal,target:g.target,players:g.players});
  const closeVictory=()=>{S.tap();setVictory(null);setFinished(null);go('home')};

  const shown=data.active||finished;
  const inGame=screen==='game'&&!!shown;
  const ctx={data,setData,theme,toggleTheme,colorOf,colorIdx,stats,awards,screen,go,openSheet,closeSheet,assignColor,flash,moment,S,V,
    actions:{startGame,submitRound,saveRound,deleteRound,endGame,discardGame,deleteGame,clearSamples,rematch,toggleMute,closeVictory,showToast}};

  const sheetEl=()=>{if(!sheet)return null;const t=sheet.type;
    if(t==='new')return html`<${NewGameSheet} ctx=${ctx}/>`;
    if(t==='round'&&data.active&&data.active.rounds[sheet.idx])return html`<${RoundSheet} ctx=${ctx} idx=${sheet.idx}/>`;
    if(t==='end'&&data.active)return html`<${EndSheet} ctx=${ctx}/>`;
    if(t==='detail'){const g=data.games.find(x=>x.id===sheet.id);return g?html`<${DetailSheet} ctx=${ctx} g=${g}/>`:null}
    const X=V.sheets&&V.sheets[t];return X?html`<${X} ctx=${ctx} sheet=${sheet}/>`:null};
  const Banner=V.Banner||DefaultBanner;

  return html`<${React.Fragment}>
    ${inGame?html`<${V.Game} ctx=${ctx} g=${shown}/>`:screen==='history'?html`<${History} ctx=${ctx}/>`:html`<${V.Home} ctx=${ctx}/>`}
    ${!inGame&&html`<${Nav} ctx=${ctx}/>`}
    ${sheet&&html`<${Sheet} closing=${closing} onClose=${()=>closeSheet()} label=${sheet.type}>${sheetEl()}<//>`}
    ${banner&&html`<${Banner} key=${banner.k} b=${banner}/>`}
    ${toast&&html`<div className=${'toast'+(inGame?' low':'')} key=${toast.k} role="status"><${Icon} name=${V.toastIcon(toast.icon)} size=${18}/><span>${toast.msg}</span></div>`}
    ${victory&&html`<${V.Victory} key=${victory.k} ctx=${ctx} v=${victory}/>`}
  <//>`;
}

function mount(V){FX.configure(V.fx||{});ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} V=${V}/>`)}

return{html,React,useState,useEffect,useRef,useMemo,useLayoutEffect,
  DEFAULT_PLAYERS,PRESETS,AWARDS,awardById,SUITS,
  totalsOf,totalsAt,leaderOf,leadersOf,ranked,goalLabel,evaluate,leadTimeline,leadChanges,roundTop,songOf,
  fmtDate,ordinal,joinNames,hash,midi,after,cssVar,reduceMotion,vibrate,
  SND,FX,ICONS,Icon,Fox,Chip,Roll,ThemeBtn,MuteBtn,Podium,ScoreFields,SheetTitle,mount};
})();

</script>
<script>
(function(){
const T=TH,{html,useState,useEffect,useRef,Icon,Fox,Chip,Roll,ThemeBtn,MuteBtn,Podium,ScoreFields,SND,FX,awardById}=T;
const{totalsOf,leaderOf,ranked,goalLabel,roundTop,songOf,fmtDate,after,cssVar,midi}=T;

/* ---------- music: every game writes a tune ---------- */
const PENTA=[60,62,64,67,69,72,74,76,79,81,84,86,88,91,93];
const BASS=[48,45,41,43];
const noteIdx=(ci,v)=>Math.min(PENTA.length-1,(ci*2)%7+Math.min(6,Math.floor(Math.max(0,v)/12)));
const noteFor=(ci,v)=>PENTA[noteIdx(ci,v)];
const P=(m,at=0,vol=.3,d=1.2,b=.55)=>SND.pluck(midi(m),d,{at,vol,bright:b});
const drum=(at=0)=>{SND.noise(.12,{type:'lowpass',freq:420,vol:.45,at});SND.tone(95,.14,{to:48,vol:.4,at})};
function playSong(g,colorIdx,onStep,step=.3){
  const song=songOf(g);const ids=[];
  song.forEach((r,i)=>{const at=i*step;P(BASS[i%4],at,.2,1.6,.3);r.ps.forEach(p=>P(noteFor(colorIdx(p),r.v),at,.3));ids.push(setTimeout(()=>onStep&&onStep(i),at*1000+15))});
  const end=song.length*step;
  if(g.winner){[48,55,60,64].forEach((m,k)=>P(m,end+k*.035,.22,2.2,.4));P(noteFor(colorIdx(g.winner),99)+12,end+.15,.3,2)}
  ids.push(setTimeout(()=>onStep&&onStep(-1),(end+1)*1000));
  return()=>{ids.forEach(clearTimeout);onStep&&onStep(-1)};
}
const sfx={
  tap:()=>P(84,0,.13,.4,.7),
  pick:()=>{P(79,0,.17,.6);P(84,.06,.17,.6)},
  focus:i=>P(PENTA[(i*2)%10+2],0,.09,.5),
  open:()=>[67,72,76].forEach((m,i)=>P(m,i*.045,.17,.7)),
  close:()=>[76,72,67].forEach((m,i)=>P(m,i*.045,.14,.6)),
  add:()=>{P(72);P(79,.08)},
  remove:()=>{P(72,0,.2);P(60,.08,.2,.8,.3)},
  submit:(g,ci)=>{drum();const r=g.rounds[g.rounds.length-1];if(!r)return;[...g.players].sort((a,b)=>(r.scores[a]??0)-(r.scores[b]??0)).forEach((p,i)=>P(noteFor(ci(p),r.scores[p]??0),.06+i*.08,.18+i*.05))},
  start:()=>{drum();[48,55,60,64,67,72].forEach((m,i)=>P(m,.05+i*.045,.22,1.6))},
  lead:(g,m,ci)=>{const n=noteFor(ci(m.p),40);P(n);P(n+12,.14);P(n+7,.28)},
  hot:(g,m,ci)=>{const n=noteFor(ci(m.p),30);for(let i=0;i<6;i++)P(i%2?n+2:n,i*.06,.2,.4)},
  match:()=>[60,65,67].forEach((m,i)=>P(m,i*.025,.22,1.5)),
  bust:()=>{P(43,0,.35,1.2,.25);P(44,.012,.25,1.2,.25)},
  tie:()=>{P(72);P(74,.15);P(72,.3);P(74,.45)},
  error:()=>P(40,0,.3,.6,.2),
  del:()=>[72,67,64,60].forEach((m,i)=>P(m,i*.06,.17,.6)),
  win:()=>{drum();drum(.18)},
  lose:()=>[67,63,60,55].forEach((m,i)=>P(m,i*.28,.22,1.2,.4)),
  theme:()=>SND.noise(.32,{type:'bandpass',freq:1200,to:3200,q:.7,vol:.13,attack:.08}),
};

/* ---------- pieces ---------- */
const Mis=({t,cls='',tag='span',style})=>html`<${tag} className=${'mis '+cls} data-t=${t} style=${style}>${t}<//>`;
const Eq=()=>html`<span className="eq" aria-hidden="true">${[0,1,2,3].map(k=>html`<i key=${k} style=${{'--k':k}}></i>`)}</span>`;
function Staff({g,ctx,active=-1,freshLast=false,unit=20}){
  const song=songOf(g);const n=song.length;const W=Math.max(140,34+n*unit+10);const H=70;
  const yOf=i=>58-i*3.4;
  return html`<svg className="staff" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${n?`Melody of ${n} notes`:'No notes yet'}>
    ${[0,1,2,3,4].map(k=>html`<line key=${k} className="ln" x1="0" x2=${W} y1=${14+k*10} y2=${14+k*10}/>`)}
    <text className="clef" x="2" y="46">♪</text>
    ${song.map((r,i)=>{const x=34+i*unit+unit/2;
      if(!r.ps.length)return html`<rect key=${i} className="rest" x=${x-4} y="32" width="8" height="5" rx="1"/>`;
      return html`<g key=${i} className=${'nt'+(active===i?' act':'')+(freshLast&&i===n-1?' fresh':'')}>${r.ps.map((p,k)=>{const y=yOf(noteIdx(ctx.colorIdx(p),r.v))-k*2;
        return html`<g key=${p}><line className="stem" x1=${x+5} x2=${x+5} y1=${y} y2=${y-20}/><ellipse className="head" cx=${x} cy=${y} rx="6" ry="4.6" transform=${`rotate(-18 ${x} ${y})`} style=${{fill:ctx.colorOf(p)}}/></g>`})}</g>`})}
  </svg>`;
}
function useSong(ctx){
  const[playing,setPlaying]=useState(null);const[step,setStep]=useState(-1);const stop=useRef(null);
  useEffect(()=>()=>stop.current&&stop.current(),[]);
  const toggle=g=>{if(stop.current){stop.current();stop.current=null}
    if(playing===g.id){setPlaying(null);return}
    setPlaying(g.id);stop.current=playSong(g,ctx.colorIdx,i=>{setStep(i);if(i<0){setPlaying(p=>p===g.id?null:p)}})};
  return{playing,step,toggle};
}
function Sleeve({ctx,g,song}){
  const on=song.playing===g.id;
  return html`<div className=${'sleeve'+(on?' on':'')} style=${{'--c':ctx.colorOf(g.winner)}}>
    <div className="sleeve-art ht"><span className="disc"></span><b>${g.name}</b></div>
    <div className="staff-wrap"><${Staff} g=${g} ctx=${ctx} active=${on?song.step:-1} unit=${Math.max(9,Math.min(20,150/Math.max(1,g.rounds.length)))}/></div>
    <div className="sleeve-foot"><span>${g.winner} won<br/>${fmtDate(g.completedAt)} · ${g.rounds.length} rounds</span>
      <button className="play" onClick=${()=>song.toggle(g)} aria-label=${(on?'Stop ':'Play ')+g.name+' song'}><${Icon} name=${on?'pause':'play'} size=${18} stroke=${2}/></button></div>
  </div>`;
}

/* ---------- home ---------- */
function Home({ctx}){
  const{data,stats:s,colorOf,openSheet,S,go,actions}=ctx;const done=data.games;const song=useSong(ctx);
  const now=new Date();const month=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const swing=s.swingGame;
  return html`<main className="app">
    <header className="mast">
      <div className="mast-top"><span className="eyebrow">No. ${s.total+1} · ${month}</span><${ThemeBtn} ctx=${ctx}/><${MuteBtn} ctx=${ctx}/></div>
      <div className="mast-main">
        <h1 className="mast-title" aria-label="Tally Ho!"><${Mis} t="TALLY"/><${Mis} t="HO!"/></h1>
        <div className="mast-fox" aria-hidden="true"><span className="sun ht"></span><span className="ghost"><${Fox}/></span><${Fox} twitch=${true}/></div>
      </div>
      <div className="mast-sub"><span>The family game night zine</span><span>Every game writes a tune</span></div>
    </header>
    ${data.hasSamples&&html`<div className="notice"><p>Sample tracks so you can hear how it works. They clear when you start your first real game.</p><button className="btn btn-quiet small" onClick=${actions.clearSamples}>Clear</button></div>`}
    ${data.active&&html`<button className="card resume" onClick=${()=>{S.pick();go('game')}}>
      <div className="grow"><div className="eyebrow"><${Eq}/>Now playing</div><div className="gt">${data.active.name}</div><p className="hint">Round ${data.active.rounds.length+1} · ${goalLabel(data.active)}</p></div>
      <span className="btn btn-main small">Resume</span></button>`}
    ${done.length===0?html`<div className="card empty"><${Fox} crown=${true}/><h2 className="sec">No hits yet</h2><p className="hint">Finish a game and it enters the charts.</p><button className="btn btn-main" onClick=${()=>openSheet({type:'new'})}><${Icon} name="plus"/> New game</button></div>`:html`
      <section className="card charts">
        <div className="sec-head"><h2 className="sec">The charts</h2><span className="eyebrow">By wins</span></div>
        ${s.standings.map((x,i)=>{const prev=s.prevRank[x.p];const mv=prev==null?'new':prev>i?'up':prev<i?'down':'same';const rep=s.current.p===x.p&&s.current.n>=2;
          return html`<div className=${'crow rise'+(i===0?' no1':'')} key=${x.p} style=${{'--i':i}}>
            <span className="pos">${i+1}</span>
            <span className=${'mv '+mv} title=${mv==='new'?'New entry':mv==='up'?'Moved up':mv==='down'?'Moved down':'No change'}>${mv==='new'?html`<small className="eyebrow">new</small>`:html`<${Icon} name=${mv==='same'?'dash':mv} size=${18} stroke=${3}/>`}</span>
            <${Chip} name=${x.p} color=${colorOf(x.p)} size=${34} crown=${i===0}/>
            <div className="nm" style=${{minWidth:0}}><b>${x.p}</b><small>${rep?`On repeat · ${s.current.n} in a row`:`${x.n?Math.round(x.w/x.n*100):0}% of games`}</small></div>
            <span className="wn num">${x.w}<small>WINS</small></span></div>`})}
      </section>
      <section>
        <div className="sec-head"><h2 className="sec">Mixtape</h2><span className="eyebrow">Tap play to hear a game</span></div>
        <div className="hscroll">${done.slice(0,6).map(g=>html`<${Sleeve} key=${g.id} ctx=${ctx} g=${g} song=${song}/>`)}</div>
      </section>
      <section>
        <div className="sec-head"><h2 className="sec">Liner notes</h2></div>
        <dl className="liner">
          <div><dt>Longest run</dt><dd>${s.best.n} wins<small>${s.best.p} in a row</small></dd></div>
          <div><dt>Biggest round</dt><dd className="num">${s.big.v>-Infinity?s.big.v:'–'}<small>${s.big.p?`${s.big.p}, ${s.big.game}`:''}</small></dd></div>
          <div><dt>Most lead changes</dt><dd>${s.swings}<small>${swing?`${swing.name}, ${fmtDate(swing.completedAt)}`:'No swings yet'}</small></dd></div>
          <div><dt>Most played</dt><dd>${s.fav?s.fav[0]:'–'}<small>${s.fav?s.fav[1]+' games':''}</small></dd></div>
        </dl>
      </section>
      <section>
        <div className="sec-head"><h2 className="sec">Latest tracks</h2><button className="link" onClick=${()=>{S.tap();go('history')}}>Back catalog <${Icon} name="right" size=${14}/></button></div>
        <div className="tracks">${done.slice(0,3).map(g=>html`<${GameRow} key=${g.id} ctx=${ctx} g=${g}/>`)}</div>
      </section>`}
  </main>`;
}
function GameRow({ctx,g}){
  const{colorOf,openSheet,data}=ctx;const no=data.games.length-data.games.indexOf(g);const t=totalsOf(g);
  return html`<button className="track-row" onClick=${()=>openSheet({type:'detail',id:g.id})}>
    <span className="no num">${String(no).padStart(2,'0')}</span>
    <span style=${{minWidth:0}}><span className="tn" style=${{display:'block'}}>${g.name}</span><span className="tm" style=${{display:'block'}}>${fmtDate(g.completedAt)} · ${g.rounds.length} rounds · ${ranked(g).map(p=>p+' '+t[p]).join(' / ')}</span></span>
    <span className="tw"><${Chip} name=${g.winner} color=${colorOf(g.winner)} size=${26} crown=${true}/></span>
  </button>`;
}

/* ---------- game ---------- */
function Game({ctx,g}){
  const{colorOf,flash,openSheet,S,actions}=ctx;
  const t=totalsOf(g);const lead=leaderOf(g);const finished=!!g.winner;
  const[vals,setVals]=useState(()=>g.players.map(()=>''));
  useEffect(()=>setVals(g.players.map(()=>'')),[g.id]);
  const btnRef=useRef(null);const n=g.rounds.length+1;const fresh=flash&&flash.gid===g.id;
  const submit=()=>{actions.submitRound(vals,btnRef.current);setVals(g.players.map(()=>''))};
  return html`<main className="app in-game">
    <header className="g-head">
      <button className="icon-btn" onClick=${()=>{S.tap();ctx.go('home')}} aria-label="Back to the charts"><${Icon} name="back"/></button>
      <div className="g-title"><div className="eyebrow">${!finished&&html`<${Eq}/>`}${finished?'Final cut':'Now playing'}</div><div className="gt">${g.name}</div></div>
      <${ThemeBtn} ctx=${ctx}/><${MuteBtn} ctx=${ctx}/>
      ${!finished&&html`<button className="icon-btn end" onClick=${()=>openSheet({type:'end'})} aria-label="End game"><${Icon} name="flag"/></button>`}
    </header>
    <section className="card songcard">
      <div className="sec-head" style=${{margin:0}}><h2 className="sec" style=${{fontSize:19}}>The song so far</h2><span className="eyebrow">${finished?`${g.rounds.length} rounds`:`Round ${n} · ${goalLabel(g)}`}</span></div>
      ${g.rounds.length?html`<div style=${{overflowX:'auto'}}><${Staff} g=${g} ctx=${ctx} freshLast=${fresh&&!flash.edit} unit=${Math.max(14,Math.min(26,300/g.rounds.length))}/></div>`:html`<p className="hint">Each round adds a note in the round winner's color. Score the first round to start the tune.</p>`}
      ${g.goal==='score'&&html`<div className="bars">${g.players.map(p=>{const pct=Math.max(0,Math.min(1,t[p]/g.target));return html`<div className="bar-row" key=${p}><span className="bn">${p}</span><span className="bt"><span className="bf ht" style=${{width:pct*100+'%','--c':colorOf(p)}}></span></span><span className="bg">${t[p]>=g.target?'done':`${g.target-t[p]} to go`}</span></div>`})}</div>`}
    </section>
    <div className="board">
      ${g.players.map(p=>{const d=fresh?flash.scores[p]:null;const match=!finished&&g.goal==='score'&&t[p]>=g.target*.85&&t[p]<g.target;const last=g.rounds[g.rounds.length-1];const lv=last?last.scores[p]:null;
        return html`<div key=${p+(fresh?flash.k:'')} className=${['pc',lead===p&&'lead',match&&'match',d!=null&&'bump'].filter(Boolean).join(' ')} style=${{'--c':colorOf(p)}}>
          ${lead===p&&html`<span className="crownb"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z" fill="currentColor"/></svg></span>`}
          ${d!=null&&d!==0&&html`<span className="dl">${d>0?'+':''}${d}</span>`}
          <span className="pn">${p}</span>
          <span className="pt"><${Roll} value=${t[p]}/></span>
          <span className="ps">${lv!=null?`${lv>0?'+':''}${lv} last round`:'no rounds yet'}</span>
        </div>`})}
    </div>
    ${!finished&&html`<section className="card entry">
      <div className="sec-head" style=${{margin:0}}><h2 className="sec">Score round ${n}</h2><span className="eyebrow">Blank = 0</span></div>
      <${ScoreFields} ctx=${ctx} players=${g.players} values=${vals} setValues=${setVals} onDone=${submit} idp="entry-"/>
      <button ref=${btnRef} className="btn btn-main block" onClick=${submit}><${Icon} name="music" size=${20}/> Score round ${n}</button>
    </section>`}
    ${g.rounds.length>0&&html`<section className="card log" style=${{'--n':g.players.length,padding:'10px 8px'}}>
      <div className="log-head"><span style=${{textAlign:'left'}}>Rd</span>${g.players.map(p=>html`<span key=${p} style=${{color:colorOf(p)}}>${p}</span>`)}<span></span></div>
      ${g.rounds.map((r,i)=>({r,i})).reverse().map(({r,i},k)=>{const top=roundTop(r,g.players);
        return html`<button key=${i+'-'+(fresh?flash.k:'')} className=${'log-row'+(k===0&&fresh&&!flash.edit?' fresh':'')} onClick=${()=>{if(!finished)openSheet({type:'round',idx:i})}} disabled=${finished} aria-label=${finished?`Round ${i+1}`:`Edit round ${i+1}`}>
          <span className="rn">${String(i+1).padStart(2,'0')}</span>
          ${g.players.map(p=>{const v=r.scores[p];return html`<span key=${p} className=${'sc'+(v==null?' blank':'')+(top.includes(p)?' top':'')} style=${{'--c':colorOf(p)}}>${v==null?'–':v}</span>`})}
          <span className="ed">${!finished&&html`<${Icon} name="pencil" size=${14}/>`}</span></button>`})}
    </section>`}
  </main>`;
}

/* ---------- victory: the game plays its song ---------- */
function Victory({ctx,v}){
  const{g,recap}=v;const{colorOf,actions}=ctx;const[step,setStep]=useState(-1);const stop=useRef(null);const[playing,setPlaying]=useState(false);
  const play=()=>{stop.current&&stop.current();setPlaying(true);stop.current=playSong(g,ctx.colorIdx,i=>{setStep(i);if(i<0)setPlaying(false)})};
  useEffect(()=>{FX.celebrate();const a=after(800,play);const b=after(800+g.rounds.length*300+2200,()=>sfx.lose());return()=>{clearTimeout(a);clearTimeout(b);stop.current&&stop.current()}},[]);
  const mvp=recap.mvp;
  return html`<div className="victory c-vic" role="dialog" aria-modal="true" aria-label=${g.winner+' wins'} style=${{'--c':colorOf(g.winner)}}>
    <div className="burst" aria-hidden="true"></div>
    <div className="v-inner">
      <div className="eyebrow">Number one · ${g.name}</div>
      <${Mis} tag="h2" cls="v-name" t=${g.winner}/>
      <p className="v-sub">wins with ${recap.t[g.winner]} · ${g.rounds.length} rounds</p>
      <section className="card songcard">
        <div className="row"><b>The song of this game</b><button className="play" style=${{'--c':colorOf(g.winner)}} onClick=${play} aria-label="Replay the song"><${Icon} name=${playing?'music':'play'} size=${18} stroke=${2}/></button></div>
        <div style=${{overflowX:'auto'}}><${Staff} g=${g} ctx=${ctx} active=${step} unit=${Math.max(14,Math.min(26,300/Math.max(1,g.rounds.length)))}/></div>
      </section>
      <dl className="liner">
        <div><dt>Best round</dt><dd className="num">${mvp?mvp.v:'–'}<small>${mvp?`${mvp.p}, round ${mvp.i+1}`:''}</small></dd></div>
        <div><dt>Won by</dt><dd className="num">${recap.margin}<small>${recap.margin<=5?'Photo finish':'points'}</small></dd></div>
        <div><dt>Lead changes</dt><dd className="num">${recap.changes}<small>${recap.changes>=3?'A real seesaw':recap.changes===0?'Never close':'A few swings'}</small></dd></div>
        <div><dt>Runner-up</dt><dd>${recap.order[1]||'–'}<small>${recap.order[1]?recap.t[recap.order[1]]+' points':''}</small></dd></div>
      </dl>
      ${recap.earned.length>0&&html`<div className="stamps">${recap.earned.slice(0,5).map((e,i)=>{const a=awardById[e.id];return html`<span key=${i} className="rstamp" style=${{'--tone':`var(--t-${a.tone})`,'--r':((i%2?1:-1)*(3+i))+'deg','--i':i}}>${a.name}<small>${e.p}${e.isNew?' · first time':''}</small></span>`})}</div>`}
      <${Podium} ctx=${ctx} g=${g} delay=${600}/>
      <div className="v-actions">
        <button className="btn btn-quiet" onClick=${actions.closeVictory}>Done</button>
        <button className="btn btn-main" onClick=${()=>actions.rematch(g)}><${Icon} name="repeat"/> Rematch</button>
      </div>
    </div>
  </div>`;
}
function SongExtra({ctx,g}){
  const song=useSong(ctx);const on=song.playing===g.id;
  return html`<div className="card songcard" style=${{'--c':ctx.colorOf(g.winner)}}>
    <div className="row"><b>This game's song</b><button className="play" onClick=${()=>song.toggle(g)} aria-label=${on?'Stop the song':'Play the song'}><${Icon} name=${on?'pause':'play'} size=${18} stroke=${2}/></button></div>
    <div style=${{overflowX:'auto'}}><${Staff} g=${g} ctx=${ctx} active=${on?song.step:-1} unit=${Math.max(14,Math.min(26,300/Math.max(1,g.rounds.length)))}/></div>
  </div>`;
}

TH.mount({
  Home,Game,Victory,GameRow,
  detailExtra:(g,ctx)=>html`<${SongExtra} ctx=${ctx} g=${g}/>`,
  Fab:({ctx})=>html`<${Fox} twitch=${true}/><span className="plus"><${Icon} name=${ctx.data.active?'music':'plus'} size=${15} stroke=${3}/></span>`,
  navIcons:['home','music'],
  sheets:{},
  sfx,
  fx:{kinds:['note','dot','splat'],colors:()=>['--pink','--blue','--yellow','--orange','--teal'].map(cssVar),flip:false,gravity:.26},
  toastIcon:t=>t==='lead'?'music':t==='hot'?'repeat':t==='bust'?'zero':t==='match'?'flag':'sparkle',
  copy:{navHome:'Charts',navHistory:'Catalog',newTitle:'New game',startBtn:n=>`Press play · ${n}`,start:n=>`Now playing: ${n}`,round:n=>`Round ${n}`,final:'Final round',tie:'Duet! Tiebreak',
    tieToast:'Tied at the top. One more round decides it.',lead:p=>`${p} takes the solo`,hot:p=>`${p} is on repeat. 3 rounds running`,
    match:s=>`${s} is one big round from the end`,bust:s=>`${s} hit a sour note. Zero.`,samplesCleared:'Sample tracks cleared. This one counts.',historyEyebrow:'All the hits',historyTitle:'Back catalog'},
});
})();

</script>

</body></html>
