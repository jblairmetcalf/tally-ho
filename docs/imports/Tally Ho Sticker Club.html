  --ring4:0 -4px 0 var(--die),3px -3px 0 var(--die),4px 0 0 var(--die),3px 3px 0 var(--die),0 4px 0 var(--die),-3px 3px 0 var(--die),-4px 0 0 var(--die),-3px -3px 0 var(--die),2px -4px 0 var(--die),-2px 4px 0 var(--die),4px 2px 0 var(--die),-4px -2px 0 var(--die);
}

<script>
window.TH=(function(){
'use strict';
const {useState,useEffect,useRef,useMemo,useLayoutEffect}=React;
const html=htm.bind(React.createElement);

/* ============ data ============ */
const KEY='tallyho.v3';
const DEFAULT_PLAYERS=['Kate','Blair','Alder'];
const PRESETS=[
  {name:'Flip 7',goal:'score',target:200},
  {name:'Sushi Go',goal:'rounds',target:3},
  {name:'Sushi Go Party',goal:'rounds',target:3},
  {name:'Skull King',goal:'rounds',target:10},
  {name:'Uno',goal:'score',target:500},
  {name:'Cribbage',goal:'score',target:121},
  {name:'Spades',goal:'score',target:500},
  {name:'Rummy',goal:'score',target:500},
];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const load=()=>{try{const r=store.get(KEY);if(!r)return null;const d=JSON.parse(r);return d&&Array.isArray(d.games)?d:null}catch(e){return null}};
const save=d=>store.set(KEY,JSON.stringify(d));
const clone=o=>JSON.parse(JSON.stringify(o));
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const parseScore=s=>{s=String(s??'').trim();if(s===''||s==='-')return null;const n=parseInt(s,10);return isNaN(n)?null:n};
const fmtDate=(iso,o={month:'short',day:'numeric'})=>new Date(iso).toLocaleDateString('en-US',o);
const vibrate=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const after=(ms,fn)=>setTimeout(fn,ms);
const reduceMotion=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const midi=m=>440*Math.pow(2,(m-69)/12);
const joinNames=a=>a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+' & '+a[a.length-1];

function totalsAt(g,k){const t={};g.players.forEach(p=>t[p]=0);g.rounds.slice(0,k).forEach(r=>g.players.forEach(p=>{t[p]+=r.scores[p]||0}));return t}
const totalsOf=g=>totalsAt(g,g.rounds.length);
function topOf(t,players){const m=Math.max(...players.map(p=>t[p]));return players.filter(p=>t[p]===m)}
const leadersOf=g=>topOf(totalsOf(g),g.players);
const leaderOf=g=>{if(!g.rounds.length)return null;const l=leadersOf(g);return l.length===1?l[0]:null};
function evaluate(g){
  const t=totalsOf(g);
  const reached=g.goal==='score'?g.players.some(p=>t[p]>=g.target):g.goal==='rounds'?g.rounds.length>=g.target:false;
  if(!reached)return{done:false};
  const l=leadersOf(g);
  return l.length===1?{done:true,winner:l[0]}:{done:false,tie:true};
}
const goalLabel=g=>g.goal==='score'?`Race to ${g.target}`:g.goal==='rounds'?`${g.target} rounds`:'Open-ended';
const ranked=g=>{const t=totalsOf(g);return [...g.players].sort((a,b)=>t[b]-t[a])};
function leadTimeline(g){const out=[];for(let k=1;k<=g.rounds.length;k++){const l=topOf(totalsAt(g,k),g.players);out.push(l.length===1?l[0]:null)}return out}
function roundTop(r,players){const vals=players.map(p=>r.scores[p]??0);const m=Math.max(...vals);if(m<=0)return[];return players.filter(p=>(r.scores[p]??0)===m)}
function leadChanges(g){let c=0,prev=null;leadTimeline(g).forEach(l=>{if(l&&prev&&l!==prev)c++;if(l)prev=l});return c}
function songOf(g){return g.rounds.map(r=>{const ps=roundTop(r,g.players);return{ps,v:ps.length?(r.scores[ps[0]]??0):0}})}

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function makeSamples(){
  const r=rng(11),P=DEFAULT_PLAYERS,now=new Date();
  const plan=[['Flip 7','score',200],['Sushi Go','rounds',3],['Flip 7','score',200],['Skull King','rounds',10],['Flip 7','score',200],['Sushi Go','rounds',3],['Flip 7','score',200],['Flip 7','score',200],['Sushi Go','rounds',3],['Flip 7','score',200]];
  return plan.map(([name,goal,target],i)=>{
    const d=new Date(now);d.setDate(d.getDate()-(plan.length-i)*3-1);d.setHours(18+Math.floor(r()*5),Math.floor(r()*60),0,0);
    const g={id:'s'+i,sample:true,name,goal,target,players:P.slice(),rounds:[],startedAt:d.toISOString(),completedAt:null,winner:null};
    const skill={};P.forEach(p=>skill[p]=.75+r()*.5);
    let res={done:false},guard=0;
    while(!res.done&&guard++<40){
      const sc={};

function computeAwards(games){
  const asc=games.filter(g=>g.winner).sort((a,b)=>a.completedAt.localeCompare(b.completedAt));
  const counts={},byGame={},wins={},types={};let sp=null,sn=0;
  const give=(p,id,g)=>{counts[p]=counts[p]||{};const isNew=!counts[p][id];counts[p][id]=(counts[p][id]||0)+1;(byGame[g.id]=byGame[g.id]||[]).push({p,id,isNew})};
  asc.forEach(g=>{
    const w=g.winner,t=totalsOf(g),order=ranked(g),second=order[1];
    wins[w]=(wins[w]||0)+1;
    if(wins[w]===1)give(w,'crown',g);
    if(wins[w]===10)give(w,'ten',g);
    sn=w===sp?sn+1:1;sp=w;if(sn%3===0)give(w,'hat',g);
    (types[w]=types[w]||new Set()).add(g.name);if(types[w].size===3&&!(counts[w]||{}).polymath)give(w,'polymath',g);
    let deficit=0;for(let k=1;k<=g.rounds.length;k++){const tk=totalsAt(g,k);deficit=Math.max(deficit,Math.max(...g.players.map(p=>tk[p]))-tk[w])}
    if(deficit>=30)give(w,'comeback',g);
    const tl=leadTimeline(g);if(tl.length>=3&&tl.every(l=>l===w))give(w,'wire',g);
    if(second&&t[w]-t[second]<=5)give(w,'photo',g);
    if(second&&t[second]>0&&t[w]>=1.5*t[second]&&g.rounds.length>=2)give(w,'steam',g);
    g.players.forEach(p=>{
      if(g.rounds.some(r=>(r.scores[p]??0)>=60))give(p,'haymaker',g);
      if(g.rounds.some(r=>(r.scores[p]??0)===0&&g.players.some(q=>(r.scores[q]??0)>0)))give(p,'bust',g);
    });

}
function rivalries(asc){
  const m={};
  asc.forEach(g=>{const t=totalsOf(g);for(let i=0;i<g.players.length;i++)for(let j=i+1;j<g.players.length;j++){
    let a=g.players[i],b=g.players[j];if(a>b)[a,b]=[b,a];const k=a+'|'+b;const r=m[k]=m[k]||{a,b,aw:0,bw:0,n:0};
    r.n++;if(t[a]>t[b])r.aw++;else if(t[b]>t[a])r.bw++}});
  return Object.values(m).sort((x,y)=>y.n-x.n||Math.abs(x.aw-x.bw)-Math.abs(y.aw-y.bw));
}

  const players=[...new Set(asc.flatMap(g=>g.players))];const wins={},played={};
  players.forEach(p=>{wins[p]=0;played[p]=0});
  asc.forEach(g=>{g.players.forEach(p=>played[p]++);wins[g.winner]=(wins[g.winner]||0)+1});
  return players.map(p=>({p,w:wins[p],n:played[p]})).sort((a,b)=>b.w-a.w||a.p.localeCompare(b.p));
}
function computeStats(games){
  const asc=games.filter(g=>g.winner).sort((a,b)=>a.completedAt.localeCompare(b.completedAt));
  let cur={p:null,n:0},best={p:null,n:0};
  asc.forEach(g=>{cur=g.winner===cur.p?{p:cur.p,n:cur.n+1}:{p:g.winner,n:1};if(cur.n>best.n)best={...cur}});
  let big={v:-Infinity,p:null,game:null};asc.forEach(g=>g.rounds.forEach(r=>g.players.forEach(p=>{const v=r.scores[p];if(v!=null&&v>big.v)big={v,p,game:g.name}})));

  let swings=0,swingGame=null;asc.forEach(g=>{const c=leadChanges(g);if(c>swings){swings=c;swingGame=g}});
  const standings=standingsOf(asc);

  const prevRank={};prev.forEach((x,i)=>prevRank[x.p]=i);
  return{asc,standings,prevRank,current:cur,best,big,fav,swings,swingGame,total:asc.length,rivals:rivalries(asc)};
}

function Roll({value,dur=18}){
  const[d,setD]=useState(value);const prev=useRef(value);
  useEffect(()=>{const from=prev.current;prev.current=value;if(from===value)return;let i=0;const iv=setInterval(()=>{i++;const e=1-Math.pow(1-i/dur,3);setD(Math.round(from+(value-from)*e));if(i>=dur){clearInterval(iv);setD(value)}},22);return()=>clearInterval(iv)},[value]);
  return html`<span className="num">${d}</span>`;
}

function Sheet({closing,onClose,label,children}){
  const drag=useRef(null);const[dy,setDy]=useState(0);const dyRef=useRef(0);const[from,setFrom]=useState(0);
  useEffect(()=>{const k=e=>{if(e.key==='Escape')onClose()};addEventListener('keydown',k);document.body.style.overflow='hidden';return()=>{removeEventListener('keydown',k);document.body.style.overflow=''}},[]);
  const down=e=>{drag.current=e.clientY;e.currentTarget.setPointerCapture(e.pointerId)};
  const move=e=>{if(drag.current==null)return;const v=Math.max(0,e.clientY-drag.current);dyRef.current=v;setDy(v)};
  const up=()=>{if(drag.current==null)return;drag.current=null;if(dyRef.current>100){setFrom(dyRef.current);onClose()}else{dyRef.current=0;setDy(0)}};
  const style={'--from':from+'px'};
  if(dy&&!closing){style.transform=`translateY(${dy}px)`;style.transition=drag.current!=null?'none':'transform .4s var(--spring)'}

    <div className="backdrop" onClick=${onClose}></div>

}

/* ============ app ============ */
function initialTheme(){
  const t=store.get(KEY+'.theme');if(t==='light'||t==='dark')return t;
  const h=document.documentElement.getAttribute('data-theme');if(h==='light'||h==='dark')return h;
  return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}

function App({V}){
  const[data,setData]=useState(()=>load()||fresh());
  const[theme,setTheme]=useState(initialTheme);
  const[screen,setScreen]=useState(()=>data.active?'game':'home');
  const[sheet,setSheet]=useState(null);const[closing,setClosing]=useState(false);
  const[toast,setToast]=useState(null);const[banner,setBanner]=useState(null);
  const[flash,setFlash]=useState(null);const[moment,setMoment]=useState(null);
  const[victory,setVictory]=useState(null);const[finished,setFinished]=useState(null);
  const tRef=useRef(),bRef=useRef();
  const S=V.sfx;
  useEffect(()=>{save(data)},[data]);
  useEffect(()=>{SND.setMuted(!!data.muted)},[data.muted]);
  useLayoutEffect(()=>{document.documentElement.setAttribute('data-theme',theme);store.set(KEY+'.theme',theme)},[theme]);
  useEffect(()=>{const u=()=>SND.unlock();addEventListener('pointerdown',u,{once:true});return()=>removeEventListener('pointerdown',u)},[]);

  const colorIdx=n=>((data.colors&&data.colors[n])??hash(n))%8;
  const colorOf=n=>`var(--p${colorIdx(n)})`;
  const stats=useMemo(()=>computeStats(data.games),[data.games]);
  const awards=useMemo(()=>computeAwards(data.games),[data.games]);

  const showToast=(msg,icon)=>{clearTimeout(tRef.current);setToast({msg,icon,k:Date.now()});tRef.current=after(2700,()=>setToast(null))};
  const showBanner=(text,tone='')=>{clearTimeout(bRef.current);setBanner({text,tone,k:Date.now()});bRef.current=after(V.bannerMs||1450,()=>setBanner(null))};
  const openSheet=s=>{S.open();setClosing(false);setSheet(s)};
  const closeSheet=silent=>{if(!sheet)return;if(!silent)S.close();setClosing(true);after(290,()=>{setSheet(null);setClosing(false)})};
  const go=s=>{setScreen(s);window.scrollTo({top:0})};
  const toggleMute=()=>{const m=!data.muted;SND.setMuted(m);if(!m)S.pick();setData(d=>({...d,muted:m}))};
  const toggleTheme=e=>{
    const next=theme==='dark'?'light':'dark';const root=document.documentElement;
    const r=e&&e.currentTarget&&e.currentTarget.getBoundingClientRect?e.currentTarget.getBoundingClientRect():null;
    root.style.setProperty('--vt-x',(r?r.left+r.width/2:innerWidth-40)+'px');root.style.setProperty('--vt-y',(r?r.top+r.height/2:40)+'px');
    S.theme(next);
    const apply=()=>{root.setAttribute('data-theme',next);ReactDOM.flushSync(()=>setTheme(next))};
    if(document.startViewTransition&&!reduceMotion())document.startViewTransition(apply);else apply();
  };
  const assignColor=n=>setData(d=>{if(d.colors[n]!=null)return d;const used=new Set(Object.values(d.colors));let i=0;while(used.has(i)&&i<8)i++;if(i>=8)i=hash(n)%8;return{...d,colors:{...d.colors,[n]:i}}});

  function startGame(cfg){
    const g={id:'g'+Date.now(),name:cfg.name,goal:cfg.goal,target:cfg.target,players:cfg.players.slice(),rounds:[],startedAt:new Date().toISOString(),completedAt:null,winner:null};
    const hadSamples=data.hasSamples;
    setData(d=>{const colors={...d.colors};const used=new Set(Object.values(colors));cfg.players.forEach(p=>{if(colors[p]==null){let i=0;while(used.has(i)&&i<8)i++;colors[p]=i<8?i:hash(p)%8;used.add(colors[p])}});
      return{...d,active:g,colors,lastPlayers:cfg.players.slice(),games:d.hasSamples?d.games.filter(x=>!x.sample):d.games,hasSamples:false}});
    closeSheet(true);setVictory(null);setFinished(null);setFlash(null);setMoment(null);go('game');
    S.start(g);after(250,()=>showBanner(V.copy.start(cfg.name),'amber'));
    if(hadSamples)after(1600,()=>showToast(V.copy.samplesCleared));
  }
  function finish(g,winner){
    g.winner=winner;g.completedAt=new Date().toISOString();
    const games=[g,...data.games.filter(x=>x.id!==g.id)];
    const rc=recapOf(g,computeAwards(games));
    setData(d=>({...d,active:null,games}));setFinished(g);
    after(500,()=>{setVictory({g,recap:rc,k:Date.now()});S.win(g);vibrate([30,60,30])});
  }
  function detectMoment(g,before,tb){
    const lead=leaderOf(g),ta=totalsOf(g),k=g.rounds.length;
    if(lead&&lead!==before&&k>1)return{type:'lead',p:lead,names:lead};
    if(k>=3){const tops=g.rounds.slice(-3).map(r=>roundTop(r,g.players));const p=tops[0].length===1?tops[0][0]:null;
      const prior=k>=4?roundTop(g.rounds[k-4],g.players):[];
      if(p&&tops.every(t=>t.length===1&&t[0]===p)&&!(prior.length===1&&prior[0]===p))return{type:'hot',p,names:p}}
    if(g.goal==='score'){const m=g.players.filter(p=>ta[p]>=g.target*.85&&tb[p]<g.target*.85&&ta[p]<g.target);if(m.length)return{type:'match',ps:m,names:joinNames(m)}}
    const last=g.rounds[k-1];const busts=g.players.filter(p=>(last.scores[p]??0)===0);
    if(busts.length&&busts.length<g.players.length)return{type:'bust',ps:busts,names:joinNames(busts)};
    return null;
  }
  function submitRound(vals,btn){
    const g=clone(data.active);const before=leaderOf(g);const tb=totalsOf(g);
    const sc={};g.players.forEach((p,i)=>sc[p]=parseScore(vals[i]));
    g.rounds.push({scores:sc,at:new Date().toISOString()});
    S.submit(g,colorIdx);vibrate(12);FX.fromEl(btn,V.submitBurst||20,{power:9,spread:1.6});
    setFlash({k:Date.now(),gid:g.id,scores:sc});
    const res=evaluate(g);
    if(res.done){finish(g,res.winner);return}
    setData(d=>({...d,active:g}));
    const n=g.rounds.length+1;
    if(res.tie){after(250,()=>{S.tie(g);showBanner(V.copy.tie,'coral')});showToast(V.copy.tieToast);return}
    if(g.goal==='rounds'&&n===g.target)after(250,()=>showBanner(V.copy.final,'amber'));
    else after(250,()=>showBanner(V.copy.round(n),''));
    const m=detectMoment(g,before,tb);
    if(m)after(800,()=>{S[m.type]&&S[m.type](g,m,colorIdx);setMoment({...m,k:Date.now()});showToast(V.copy[m.type](m.names),m.type)});
  }
  function saveRound(idx,vals){
    const g=clone(data.active);g.players.forEach((p,i)=>g.rounds[idx].scores[p]=parseScore(vals[i]));
    closeSheet(true);S.submit(g,colorIdx);setFlash({k:Date.now(),gid:g.id,scores:g.rounds[idx].scores,edit:true});
    const res=evaluate(g);if(res.done){finish(g,res.winner);return}
    setData(d=>({...d,active:g}));showToast(`Round ${idx+1} saved`);
  }
  function deleteRound(idx){const g=clone(data.active);g.rounds.splice(idx,1);closeSheet(true);S.del();setData(d=>({...d,active:g}));showToast(`Round ${idx+1} deleted`)}
  function endGame(){const g=clone(data.active);const l=leadersOf(g);closeSheet(true);if(l.length===1&&g.rounds.length)finish(g,l[0])}
  function discardGame(){closeSheet(true);S.del();setData(d=>({...d,active:null}));go('home');showToast('Game discarded')}
  function deleteGame(id){closeSheet(true);S.del();setData(d=>({...d,games:d.games.filter(g=>g.id!==id)}));showToast('Game deleted')}
  function clearSamples(){S.del();setData(d=>({...d,games:d.games.filter(g=>!g.sample),hasSamples:false}));showToast('Samples cleared')}
  const rematch=g=>startGame({name:g.name,goal:g.goal,target:g.target,players:g.players});
  const closeVictory=()=>{S.tap();setVictory(null);setFinished(null);go('home')};

  const shown=data.active||finished;
  const inGame=screen==='game'&&!!shown;
  const ctx={data,setData,theme,toggleTheme,colorOf,colorIdx,stats,awards,screen,go,openSheet,closeSheet,assignColor,flash,moment,S,V,
    actions:{startGame,submitRound,saveRound,deleteRound,endGame,discardGame,deleteGame,clearSamples,rematch,toggleMute,closeVictory,showToast}};

  const sheetEl=()=>{if(!sheet)return null;const t=sheet.type;
    if(t==='new')return html`<${NewGameSheet} ctx=${ctx}/>`;
    if(t==='round'&&data.active&&data.active.rounds[sheet.idx])return html`<${RoundSheet} ctx=${ctx} idx=${sheet.idx}/>`;
    if(t==='end'&&data.active)return html`<${EndSheet} ctx=${ctx}/>`;
    if(t==='detail'){const g=data.games.find(x=>x.id===sheet.id);return g?html`<${DetailSheet} ctx=${ctx} g=${g}/>`:null}
    const X=V.sheets&&V.sheets[t];return X?html`<${X} ctx=${ctx} sheet=${sheet}/>`:null};
  const Banner=V.Banner||DefaultBanner;

  return html`<${React.Fragment}>
    ${inGame?html`<${V.Game} ctx=${ctx} g=${shown}/>`:screen==='history'?html`<${History} ctx=${ctx}/>`:html`<${V.Home} ctx=${ctx}/>`}
    ${!inGame&&html`<${Nav} ctx=${ctx}/>`}
    ${sheet&&html`<${Sheet} closing=${closing} onClose=${()=>closeSheet()} label=${sheet.type}>${sheetEl()}<//>`}
    ${banner&&html`<${Banner} key=${banner.k} b=${banner}/>`}
    ${toast&&html`<div className=${'toast'+(inGame?' low':'')} key=${toast.k} role="status"><${Icon} name=${V.toastIcon(toast.icon)} size=${18}/><span>${toast.msg}</span></div>`}
    ${victory&&html`<${V.Victory} key=${victory.k} ctx=${ctx} v=${victory}/>`}
  <//>`;
}

function mount(V){FX.configure(V.fx||{});ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} V=${V}/>`)}

return{html,React,useState,useEffect,useRef,useMemo,useLayoutEffect,
  DEFAULT_PLAYERS,PRESETS,AWARDS,awardById,SUITS,
  totalsOf,totalsAt,leaderOf,leadersOf,ranked,goalLabel,evaluate,leadTimeline,leadChanges,roundTop,songOf,
  fmtDate,ordinal,joinNames,hash,midi,after,cssVar,reduceMotion,vibrate,
  SND,FX,ICONS,Icon,Fox,Chip,Roll,ThemeBtn,MuteBtn,Podium,ScoreFields,SheetTitle,mount};
})();

</script>
<script>
(function(){
const T=TH,{html,useState,useEffect,useRef,useLayoutEffect,Icon,Fox,Chip,Roll,ThemeBtn,MuteBtn,Podium,ScoreFields,SheetTitle,SND,FX,ICONS,AWARDS,awardById}=T;
const{totalsOf,leaderOf,ranked,goalLabel,roundTop,fmtDate,hash,after,cssVar,vibrate}=T;

/* ---------- sound: toy-box foley ---------- */
const C=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
const mar=(f,at=0,vol=.16)=>{SND.tone(f,.34,{vol,at});SND.tone(f*4,.07,{vol:vol*.32,at});SND.tone(f*10,.02,{vol:vol*.12,at})};
const slap=(at=0,v=1)=>{SND.noise(.07,{type:'lowpass',freq:1800,vol:.45*v,at});SND.tone(150,.13,{to:55,vol:.42*v,at})};
const peel=(at=0)=>SND.noise(.22,{type:'bandpass',freq:700,to:5200,q:2.5,vol:.24,at,attack:.04});
const whistle=(f1,f2,d,at=0)=>SND.tone(f1,d,{to:f2,vol:.13,at,vib:6,vibDepth:.015,attack:.03});
const wood=(f=1600,at=0)=>{SND.tone(f,.05,{type:'triangle',vol:.2,at});SND.noise(.02,{type:'highpass',freq:3000,vol:.08,at})};
const sfx={
  tap:()=>wood(1800),
  pick:()=>{mar(784);mar(1175,.06)},
  focus:i=>mar(C[i%8],0,.05),
  open:()=>peel(),
  close:()=>{SND.noise(.14,{type:'bandpass',freq:4000,to:700,q:2,vol:.16});slap(.12,.5)},
  add:()=>{mar(659);mar(988,.07)},
  remove:()=>{mar(659);mar(440,.07)},
  submit:()=>{slap(0);mar(C[0],.06);mar(C[2],.11);mar(C[4],.16)},
  start:()=>{[0,2,4,5].forEach((n,i)=>mar(C[n],i*.08));slap(.36)},
  lead:()=>{peel();slap(.3);mar(C[5],.34);mar(C[7],.42)},
  hot:()=>whistle(500,1900,.45),
  match:()=>{wood(1500);wood(1100,.18);wood(1500,.36)},
  bust:()=>{whistle(1500,260,.55);SND.tone(180,.32,{vib:14,vibDepth:.2,vol:.14,at:.52})},
  tie:()=>{wood(1400);wood(1000,.14);wood(1400,.28);wood(1000,.42)},
  error:()=>SND.tone(220,.22,{vib:18,vibDepth:.15,vol:.14}),
  del:()=>{for(let i=0;i<5;i++)SND.noise(.05,{type:'bandpass',freq:1500+Math.random()*2500,q:1.5,vol:.18,at:i*.045})},
  win:()=>{SND.tone(440,.9,{type:'sawtooth',vol:.06,vib:7,vibDepth:.02,lp:600,lpTo:3500,attack:.05});[0,2,4,7].forEach((n,i)=>mar(C[n],.15+i*.1,.18))},
  lose:()=>whistle(700,170,1.1),
  rip:()=>{SND.noise(.4,{type:'bandpass',freq:1800,to:6500,q:1.2,vol:.4});slap(.32,.6)},
  sticker:i=>{peel(0);slap(.15,.7);mar(C[(i*2)%8],.2,.1)},
  theme:next=>{SND.noise(.025,{type:'highpass',freq:2500,vol:.25});SND.tone(next==='dark'?600:1400,.04,{type:'triangle',vol:.15,at:.012})},
};

/* ---------- pieces ---------- */
const SHAPES=(()=>{let d='';const n=14;for(let i=0;i<n*2;i++){const r=i%2?39:46,a=Math.PI*i/n-Math.PI/2;d+=(i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(50+r*Math.sin(a)).toFixed(1)}
  return['circle',d+'Z','M50 6 L88 28 V72 L50 94 L12 72 V28 Z','M24 10 H76 A14 14 0 0 1 90 24 V76 A14 14 0 0 1 76 90 H24 A14 14 0 0 1 10 76 V24 A14 14 0 0 1 24 10 Z']})();
function AwardSticker({a,size=72,locked=false,count=0,tilt=0}){
  const shape=SHAPES[AWARDS.indexOf(a)%4];
  return html`<span className=${'award'+(locked?' locked':'')} style=${{'--tone':`var(--t-${a.tone})`,width:size,height:size,transform:`rotate(${tilt}deg)`}} role="img" aria-label=${a.name+(locked?' (locked)':'')}>
    <svg viewBox="0 0 100 100" width=${size} height=${size}>
      ${shape==='circle'?html`<circle cx="50" cy="50" r="43" className="aw-bg"/>`:html`<path d=${shape} className="aw-bg"/>`}
      <g transform="translate(29 29) scale(1.75)" className="aw-ic" dangerouslySetInnerHTML=${{__html:ICONS[a.icon]}}></g>
    </svg>
    ${count>1&&html`<span className="aw-count">×${count}</span>`}
  </span>`;
}
function Tally({n,color}){
  const groups=Math.ceil(n/5);const strokes=[];let k=0;
  for(let gi=0;gi<groups;gi++){const inG=Math.min(5,n-gi*5),x0=gi*36;
    for(let s=0;s<Math.min(4,inG);s++){const x=x0+4+s*7,j=(hash(gi+'.'+s)%5)-2;strokes.push({d:`M${x} ${4+j*.5} Q${x+j*.4} 17 ${x+j*.7} 30`,k:k++})}
    if(inG===5)strokes.push({d:`M${x0} 25 L${x0+30} 8`,k:k++,diag:true})}
  if(!n)return html`<span className="hint" style=${{fontSize:12}}>No wins yet</span>`;
  const w=groups*36;
  return html`<svg className="tally" viewBox=${`-2 0 ${w+2} 34`} style=${{'--c':color,width:w*28/34}} role="img" aria-label=${n+' wins'}>${strokes.map(s=>html`<path key=${s.k} d=${s.d} pathLength="1" style=${{'--k':s.k}} className=${s.diag?'diag':''}/>`)}</svg>`;
}
const WM_COLORS=['var(--t-fox)','var(--t-amber)','var(--t-jade)','var(--t-lav)','var(--t-pink)'];
function Wordmark(){
  const letters=[...'TALLY HO!'];
  return html`<div className="wm" role="img" aria-label="Tally Ho!">${letters.map((ch,i)=>ch===' '?html`<span key=${i} className="wl sp"></span>`:html`<span key=${i} className="wl" style=${{'--i':i,'--c':WM_COLORS[i%5],'--r':((hash('w'+i)%9)-4)+'deg'}}>${ch}</span>`)}</div>`;
}
const FoxSticker=({crown,wink,twitch})=>html`<span className="fox-stk"><${Fox} crown=${crown} wink=${wink} twitch=${twitch}/></span>`;
const stickerCount=(awards,p)=>Object.keys(awards.counts[p]||{}).length;

/* ---------- home ---------- */
function Home({ctx}){
  const{data,stats:s,awards,colorOf,openSheet,S,go,actions}=ctx;const done=data.games;const top=s.standings[0];
  const tied=top&&s.standings[1]&&s.standings[1].w===top.w;
  const recent=[];for(const g of done){(awards.byGame[g.id]||[]).forEach(e=>recent.push({...e,g}));if(recent.length>=10)break}
  const labels=[
    {c:'var(--t-jade)',v:s.total,l:'Games played',ic:'cards'},
    {c:'var(--t-pink)',v:s.best.n,l:`Longest streak · ${s.best.p||'–'}`,ic:'flame'},
    {c:'var(--t-sky)',v:s.big.v>-Infinity?s.big.v:'–',l:s.big.p?`Biggest round · ${s.big.p}`:'Biggest round',ic:'bolt'},
    {c:'var(--t-amber)',v:s.fav?s.fav[0]:'–',l:s.fav?`Most played · ${s.fav[1]} games`:'Most played',ic:'trophy'},
  ];
  return html`<main className="app">
    <header className="a-top"><${FoxSticker}/><${Wordmark}/><div className="a-tools"><${ThemeBtn} ctx=${ctx}/><${MuteBtn} ctx=${ctx}/></div></header>
    ${data.hasSamples&&html`<div className="postit"><p>These are sample games so you can see how it works. They clear when you start your first real game.</p><button className="btn small" onClick=${actions.clearSamples}>Clear</button></div>`}
    ${data.active&&html`<button className="page resume rise" onClick=${()=>{S.pick();go('game')}}>
      <span className="tape">In progress</span>
      <div className="grow"><div className="gt">${data.active.name}</div><div className="hint">Round ${data.active.rounds.length+1} · ${goalLabel(data.active)}</div></div>
      <span className="go-stk">Resume <${Icon} name="right" size=${18}/></span>
    </button>`}
    ${done.length===0?html`<div className="page empty"><${FoxSticker} crown=${true}/><h2 className="sec">Your sticker book is empty</h2><p className="hint">Finish a game to put the first marks on the tally.</p><button className="btn btn-main" onClick=${()=>openSheet({type:'new'})}><${Icon} name="plus"/> New game</button></div>`:html`
      <section className="page champ rise" style=${{'--i':1}}>
        <span className="tape">${tied?'Dead heat':'Champ of the house'}</span>
        <div className="champ-row">
          <${Chip} name=${tied?'=':top.p} color=${tied?'var(--faint)':colorOf(top.p)} size=${72} crown=${!tied} crownKey=${top.p}/>
          <div className="grow">
            <div className="stk-text" style=${{'--c':tied?'var(--fg)':colorOf(top.p)}}>${tied?s.standings.filter(x=>x.w===top.w).map(x=>x.p).join(' & '):top.p}</div>
            <p className="hint">${top.w} wins out of ${s.total} games</p>
            ${s.current.n>=2&&html`<span className="badge-stk"><${Icon} name="flame" size=${15}/>${s.current.p} has won ${s.current.n} in a row</span>`}
          </div>
        </div>
      </section>
      <section className="page rise" style=${{'--i':2}}>
        <div className="sec-head"><h2 className="sec">The tally</h2><span className="hint" style=${{fontSize:12}}>Tap a name for their album</span></div>
        ${s.standings.map(x=>html`<button className="tally-row" key=${x.p} style=${{'--c':colorOf(x.p)}} onClick=${()=>openSheet({type:'album',p:x.p})}>
          <${Chip} name=${x.p} color=${colorOf(x.p)} size=${40}/>
          <div className="who"><b>${x.p}</b><${Tally} n=${x.w} color=${colorOf(x.p)}/><small><${Icon} name="album" size=${13}/>${stickerCount(awards,x.p)} of ${AWARDS.length} stickers</small></div>
          <span className="wins-n num">${x.w}</span>
        </button>`)}
      </section>
      ${recent.length>0&&html`<section className="page rise" style=${{'--i':3}}>
        <div className="sec-head"><h2 className="sec">Fresh stickers</h2></div>
        <div className="hscroll stickers">${recent.map((e,i)=>{const a=awardById[e.id];return html`<button className="fresh-stk" key=${e.g.id+e.p+e.id} onClick=${()=>openSheet({type:'album',p:e.p})}>
          <${AwardSticker} a=${a} size=${66} tilt=${i%2?5:-5}/><b>${a.name}</b><span>${e.p} · ${e.g.name}</span></button>`})}</div>
      </section>`}
      <section className="labels">${labels.map((l,i)=>html`<div className="label" key=${i} style=${{'--c':l.c,'--r':(i%2?1.5:-1.5)+'deg','--i':i}}><${Icon} name=${l.ic} size=${20}/><span className="v">${l.v}</span><span className="l">${l.l}</span></div>`)}</section>
      <section className="group rise" style=${{'--i':5}}>
        <div className="sec-head"><h2 className="sec">Recent games</h2><button className="link" onClick=${()=>{S.tap();go('history')}}>See all <${Icon} name="right" size=${16}/></button></div>
        ${done.slice(0,3).map(g=>html`<${GameRow} key=${g.id} ctx=${ctx} g=${g}/>`)}
      </section>`}
  </main>`;
}
function GameRow({ctx,g}){
  const t=totalsOf(g);const{colorOf,openSheet}=ctx;
  return html`<button className="page game-row" onClick=${()=>openSheet({type:'detail',id:g.id})}>
    <${Chip} name=${g.winner} color=${colorOf(g.winner)} size=${44} crown=${true}/>
    <div className="grow"><div className="gname">${g.name}</div><p className="hint">${g.winner} won · ${fmtDate(g.completedAt)} · ${g.rounds.length} rounds</p>
      <div className="mini">${ranked(g).map(p=>html`<span key=${p} className=${p===g.winner?'w':''} style=${{'--c':colorOf(p)}}>${p} ${t[p]}</span>`)}</div></div>
    <${Icon} name="right" size=${18}/>
  </button>`;
}

/* ---------- game ---------- */
function Progress({ctx,g}){
  const t=totalsOf(g);const{colorOf}=ctx;
  if(g.goal==='score')return html`<div className="page ruler">
    <span className="tape">${goalLabel(g)}</span>
    ${g.players.map(p=>{const pct=Math.max(0,Math.min(1,t[p]/g.target));return html`<div className="lane" key=${p} style=${{'--c':colorOf(p)}}>
      <div className="base"></div><div className="fillt" style=${{width:pct*100+'%'}}></div>
      <span className="flagend"><${Icon} name="flag" size=${20}/></span>
      <div className="runner" style=${{left:pct*100+'%'}}><${Chip} name=${p} color=${colorOf(p)} size=${26}/></div></div>`})}
    <div className="ruler-foot"><span>0</span><span>${g.target}</span></div>
  </div>`;
  if(g.goal==='rounds'){const n=g.rounds.length;return html`<div className="page" style=${{paddingTop:22}}>
    <span className="tape">${n} of ${g.target} rounds</span>
    <div className="slots">${Array.from({length:g.target},(_,i)=>{const r=g.rounds[i];const top=r?roundTop(r,g.players):[];
      return html`<span key=${i} className=${'slot-r'+(r?' done':i===n?' now':'')} style=${{'--c':top.length===1?colorOf(top[0]):'var(--t-amber)'}} title=${r?(top.length===1?top[0]+' won round '+(i+1):'Round '+(i+1)):''}>${r&&top.length===1?top[0][0]:i+1}</span>`})}</div>
  </div>`}
  return null;
}
function Game({ctx,g}){
  const{colorOf,flash,moment,openSheet,S,actions}=ctx;
  const t=totalsOf(g);const lead=leaderOf(g);const finished=!!g.winner;
  const[vals,setVals]=useState(()=>g.players.map(()=>''));
  useEffect(()=>setVals(g.players.map(()=>'')),[g.id]);
  const btnRef=useRef(null);const cards=useRef({});const[star,setStar]=useState(null);const turns=useRef(0);const prevLead=useRef(lead);
  if(prevLead.current!==lead){if(prevLead.current&&lead)turns.current++;prevLead.current=lead}
  useLayoutEffect(()=>{const m=()=>{const el=lead&&cards.current[lead];setStar(el?{x:el.offsetLeft+el.offsetWidth-34,y:el.offsetTop-20}:null)};m();addEventListener('resize',m);return()=>removeEventListener('resize',m)},[lead,g.players.length]);
  const n=g.rounds.length+1;const fresh=flash&&flash.gid===g.id;
  const submit=()=>{actions.submitRound(vals,btnRef.current);setVals(g.players.map(()=>''))};
  return html`<main className="app in-game">
    <header className="g-top">
      <button className="icon-btn" onClick=${()=>{S.tap();ctx.go('home')}} aria-label="Back to home"><${Icon} name="back"/></button>
      <div className="g-title"><div className="gt">${g.name}</div><p className="hint">${finished?`${g.winner} won · ${g.rounds.length} rounds`:`Round ${n} · ${goalLabel(g)}`}</p></div>
      <${ThemeBtn} ctx=${ctx}/><${MuteBtn} ctx=${ctx}/>
      ${!finished&&html`<button className="icon-btn end" onClick=${()=>openSheet({type:'end'})} aria-label="End game"><${Icon} name="flag"/></button>`}
    </header>
    <${Progress} ctx=${ctx} g=${g}/>
    <div className="board">
      ${g.players.map(p=>{
        const d=fresh?flash.scores[p]:undefined;const match=!finished&&g.goal==='score'&&t[p]>=g.target*.85&&t[p]<g.target;
        const last=g.rounds[g.rounds.length-1];const lv=last?last.scores[p]:null;
        return html`<div key=${p+(fresh?flash.k:'')} ref=${el=>cards.current[p]=el} className=${['page','pcard',lead===p&&'lead',match&&'match',d!=null&&'bump'].filter(Boolean).join(' ')} style=${{'--c':colorOf(p)}}>
          <${Chip} name=${p} color=${colorOf(p)} size=${40}/>
          ${d!=null&&d!==0&&html`<span className="delta-stk">${d>0?'+':''}${d}</span>`}
          <span className="pname">${p}</span>
          <span className="stk-text ptotal"><${Roll} value=${t[p]}/></span>
          <span className="psub">${g.goal==='score'&&!finished?(t[p]>=g.target?'Past the flag':`${g.target-t[p]} to go`):(lv!=null?`${lv>0?'+':''}${lv} last round`:'No rounds yet')}</span>
        </div>`})}
      <svg className="gold-star" viewBox="0 0 24 24" aria-hidden="true" style=${{opacity:star?1:0,transform:star?`translate(${star.x}px,${star.y}px) rotate(${turns.current*360-12}deg)`:'translate(50%,0) scale(0)'}}><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
    </div>
    ${!finished&&html`<section className="page entry">
      <span className="tape">Score round ${n}</span>
      <${ScoreFields} ctx=${ctx} players=${g.players} values=${vals} setValues=${setVals} onDone=${submit} idp="entry-"/>
      <div className="entry-foot"><span className="hint">Blank counts as 0</span></div>
      <button ref=${btnRef} className="btn btn-main block" onClick=${submit}><${Icon} name="check"/> Score round ${n}</button>
    </section>`}
    ${g.rounds.length>0&&html`<section className="page log" style=${{'--n':g.players.length,padding:8}}>
      <div className="log-head"><span style=${{textAlign:'left'}}>Rd</span>${g.players.map(p=>html`<span key=${p} style=${{color:colorOf(p)}}>${p}</span>`)}<span></span></div>
      ${g.rounds.map((r,i)=>({r,i})).reverse().map(({r,i},k)=>{const top=roundTop(r,g.players);
        return html`<button key=${i+'-'+(fresh?flash.k:'')} className=${'log-row'+(k===0&&fresh&&!flash.edit?' fresh':'')} onClick=${()=>{if(!finished)openSheet({type:'round',idx:i})}} disabled=${finished} aria-label=${finished?`Round ${i+1}`:`Edit round ${i+1}`}>
          <span className="rn">${i+1}</span>
          ${g.players.map((p,j)=>{const v=r.scores[p];return html`<span key=${p} className=${'sc'+(v==null?' blank':'')+(top.includes(p)?' top':'')} style=${{'--c':colorOf(p),'--j':j}}>${v==null?'–':v}</span>`})}
          <span className="ed">${!finished&&html`<${Icon} name="pencil" size=${15}/>`}</span>
        </button>`})}
    </section>`}
  </main>`;
}

/* ---------- victory: tear open a sticker pack ---------- */
function Victory({ctx,v}){
  const{g,recap}=v;const{colorOf,S,actions}=ctx;
  const[open,setOpen]=useState(false);const[shown,setShown]=useState(0);
  const items=[{kind:'win',p:g.winner},...recap.earned.slice().sort((a,b)=>b.isNew-a.isNew).slice(0,5).map(e=>({kind:'award',...e}))];
  const timers=useRef([]);useEffect(()=>()=>timers.current.forEach(clearTimeout),[]);
  const tear=()=>{if(open)return;setOpen(true);S.rip();vibrate(20);timers.current.push(after(200,()=>FX.celebrate()));
    items.forEach((_,i)=>timers.current.push(after(500+i*280,()=>{setShown(i+1);S.sticker(i)})));
    timers.current.push(after(900+items.length*280+900,()=>S.lose()))};
  return html`<div className="victory a-vic" role="dialog" aria-modal="true" aria-label=${g.winner+' wins'}>
    <div className="v-inner">
      <div className="eyebrow">${g.name} · ${g.rounds.length} rounds</div>
      <div className="stk-text huge" style=${{'--c':colorOf(g.winner)}}>${g.winner} wins!</div>
      ${!open?html`<button className="pack" onClick=${tear} aria-label="Tear open the sticker pack">
          <span className="crimp top"></span>
          <span className="pack-body"><${FoxSticker} crown=${true} wink=${true}/><span className="pack-title">Game night pack</span><span className="pack-sub">${items.length} sticker${items.length>1?'s':''} inside</span></span>
          <span className="crimp bottom"></span>
        </button>
        <p className="hint">Tap the pack to tear it open</p>`
      :html`<span className="strip crimp top" aria-hidden="true"></span>
        <div className="haul">${items.slice(0,shown).map((it,i)=>{const a=it.kind==='award'?awardById[it.id]:null;return html`<div className="haul-item" key=${i} style=${{'--r':((i%2?1:-1)*(3+i*2))+'deg'}}>
          ${a?html`<${AwardSticker} a=${a} size=${74}/>`:html`<span className="win-stk"><${Chip} name=${it.p} color=${colorOf(it.p)} size=${60} crown=${true}/><b>Winner</b></span>`}
          <span className="hi-name">${a?a.name:g.name}</span>
          <span className="hi-who">${it.p}${it.isNew?html` · <em>new</em>`:''}</span></div>`})}</div>
        ${shown>=items.length&&html`<${Podium} ctx=${ctx} g=${g}/>`}`}
      <div className="v-actions">
        <button className="btn btn-quiet" onClick=${actions.closeVictory}>Done</button>
        <button className="btn btn-main" onClick=${()=>actions.rematch(g)}><${Icon} name="repeat"/> Rematch</button>
      </div>
    </div>
  </div>`;
}

/* ---------- album sheet ---------- */
function AlbumSheet({ctx,sheet}){
  const{awards,colorOf,S,stats,data}=ctx;
  const players=[...new Set([...stats.standings.map(x=>x.p),...(data.active?data.active.players:[])])];
  const[p,setP]=useState(sheet.p||players[0]);
  const counts=awards.counts[p]||{};const got=AWARDS.filter(a=>counts[a.id]).length;
  return html`<${SheetTitle} ctx=${ctx} title=${p+"'s album"}/>
    <div className="pills scroll">${players.map(q=>html`<button key=${q} className=${'pill'+(q===p?' on':'')} onClick=${()=>{S.sticker(0);setP(q)}}><${Chip} name=${q} color=${colorOf(q)} size=${20}/>${q}</button>`)}</div>
    <div className="album-meter"><div className="bar"><i style=${{width:got/AWARDS.length*100+'%'}}></i></div><span>${got} of ${AWARDS.length}</span></div>
    <div className="album-grid">${AWARDS.map((a,i)=>html`<div className=${'slot'+(counts[a.id]?' got':'')} key=${a.id+p} style=${{'--i':i}}>
      <${AwardSticker} a=${a} locked=${!counts[a.id]} count=${counts[a.id]||0} tilt=${((i*37)%11)-5} size=${70}/>
      <b>${a.name}</b><span>${a.desc}</span></div>`)}</div>`;
}
function detailExtra(g,ctx){
  const list=ctx.awards.byGame[g.id]||[];if(!list.length)return null;
  return html`<div className="group"><span className="eyebrow">Stickers from this game</span><div className="earned-row">${list.map((e,i)=>html`<div className="er" key=${i}><${AwardSticker} a=${awardById[e.id]} size=${54} tilt=${i%2?4:-4}/>${awardById[e.id].name}<span>${e.p}</span></div>`)}</div></div>`;
}

TH.mount({
  Home,Game,Victory,GameRow,detailExtra,
  Fab:()=>html`<${FoxSticker} twitch=${true}/><span className="plus"><${Icon} name="plus" size=${17} stroke=${3}/></span>`,
  navIcons:['home','album'],
  sheets:{album:AlbumSheet},
  sfx,
  fx:{kinds:['star','circle','suit'],colors:()=>['--t-jade','--t-amber','--t-fox','--t-lav','--t-pink','--t-sky'].map(cssVar),outline:()=>cssVar('--die'),flip:true},
  toastIcon:t=>t==='lead'?'star':t==='hot'?'flame':t==='bust'?'zero':'sparkle',
  copy:{navHome:'Home',navHistory:'Book',newTitle:'New game',startBtn:n=>`Deal in · ${n}`,start:n=>`${n}!`,round:n=>`Round ${n}`,final:'Last round!',tie:'Tiebreak!',
    tieToast:'Tied at the top. One more round decides it.',lead:p=>`The gold star moves to ${p}`,hot:p=>`${p} won three rounds running`,
    match:s=>`${s} can almost taste it`,bust:s=>`${s} went bust. Ouch.`,samplesCleared:'Samples cleared. This one counts.',historyEyebrow:'History',historyTitle:'The sticker book'},
});
})();

</script>
